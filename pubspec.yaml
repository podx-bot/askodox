name: podx
description: A responsive local commerce experience for buyers and sellers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.2.2
  crypto: ^3.0.6
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_auth: ^5.5.2
  firebase_in_app_messaging: ^0.8.1+5
  firebase_app_installations: ^0.3.2+5
  shared_preferences: ^2.3.5
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  # Live barcode / QR scan preview (frames decoded by zxing_lib). Must pass sms-consent-e2e.yml (mobile_scanner broke it).
  camera: ^0.11.0+2
  # The older Android implementation: camera_android_camerax failed to compile with this build's javac (2026-11-19).
  camera_android: ^0.10.10
  # Owner 2026-11-23 (attendance): live face check on the phone -- Google ML Kit face detection, free, on-device, no
  # API bill (head turn / nod / blink in a random order; a photo of a photo does not move).
  google_mlkit_face_detection: ^1.0.2
  # Owner 2026-11-28: papers (bills, warranty) are scanned like Google Drive's camera -- ML Kit document scanner (edges found,
  # straightened, cleaned), on-device through Google Play services. Must pass sms-consent-e2e.yml.
  google_mlkit_document_scanner: ^0.7.2
  file_picker: ^12.2.0
  pdf: ^3.11.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  # Real device GPS location (permission request + current position).
  # Backs lib/features/location/data/geolocator_location_gateway.dart.
  geolocator: ^14.0.3
  # flutter_localizations pins the compatible intl release for the active
  # Flutter SDK. Keeping this unconstrained avoids dependency-solver failures
  # when the SDK updates that pin.
  intl: any
  webview_flutter: ^4.14.1
  # Android file chooser for <input type=file> in the Staff Workspace page.
  webview_flutter_android: ^4.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  video_player: ^2.14.1
  # Smart Tools level / inclinometer / compass (accelerometer + magnetometer;
  # no runtime permission). Backs lib/features/smart_tools/presentation/
  # sensor_tools_screen.dart; tests inject askodoxMotionSensorsProvider.
  sensors_plus: '>=6.1.0 <9.0.0'
  # Smart Tools > My devices: Bluetooth LE scan / connect / standard GATT
  # profiles (lib/features/devices/data/ble_gateway.dart). 1.x API (connect
  # without a licence argument); tests inject askodoxBleGatewayProvider.
  flutter_blue_plus: ^1.35.0
  # POS barcode reading from a camera photo, pure Dart (no native plugin: mobile_scanner broke OTP SMS consent).
  zxing_lib: ^1.1.4

# shared_preferences_android 2.5.0 moved to Pigeon JNI; in the APK it fails at
# start-up (NoSuchMethodError SharedPreferencesApiRegistrar.getAll -> endless
# white spinner, APK 1335). 2.4.28 is the version proven on devices (APK 1334),
# same storage file, so sessions / profiles are kept. Change only after an
# emulator / device proof (phone-test-link "Emulator startup gate").
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/noto/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/noto/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/noto/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/noto/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/noto/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/noto/NotoSansBengali-Bold.ttf
          weight: 700
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/noto/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/noto/NotoSansGujarati-Bold.ttf
          weight: 700
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/noto/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/noto/NotoSansKannada-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/noto/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/noto/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: NotoSansOriya
      fonts:
        - asset: assets/fonts/noto/NotoSansOriya-Regular.ttf
        - asset: assets/fonts/noto/NotoSansOriya-Bold.ttf
          weight: 700
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/noto/NotoSansGurmukhi-Regular.ttf
        - asset: assets/fonts/noto/NotoSansGurmukhi-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/noto/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/noto/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/noto/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/noto/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansOlChiki
      fonts:
        - asset: assets/fonts/noto/NotoSansOlChiki-Regular.ttf
        - asset: assets/fonts/noto/NotoSansOlChiki-Bold.ttf
          weight: 700
    - family: NotoSansMeeteiMayek
      fonts:
        - asset: assets/fonts/noto/NotoSansMeeteiMayek-Regular.ttf
        - asset: assets/fonts/noto/NotoSansMeeteiMayek-Bold.ttf
          weight: 700
  generate: true
  assets:
    - assets/mock/catalog.json
    - assets/companion/engine.html
    - assets/companion/human2d/
    - assets/mascots/
    - assets/work_audio/
    - assets/work_scenes/
    - assets/work_sprites/
    - assets/brand/askodox_icon.png
    - assets/brand/askodox_mark.png
