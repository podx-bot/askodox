name: podx
description: A responsive local commerce experience for buyers and sellers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.2.2
  shared_preferences: ^2.3.5
  package_info_plus: ^8.1.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  pdf: ^3.11.3
  qr_flutter: ^4.1.0
  # flutter_localizations pins the compatible intl release for the active
  # Flutter SDK. Keeping this unconstrained avoids dependency-solver failures
  # when the SDK updates that pin.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/catalog.json
