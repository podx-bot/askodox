    <g stroke-width="2.1">
      <path d="M52,34 L44,34 L40,30.5"/>
      <path d="M52,42 L38,42 L33,37"/>
      <path d="M52,50 L42,50"/>
      <path d="M52,57 L36,57 L31,52"/>
      <path d="M52,65 L45,65 L40,70"/>
      <path d="M52,73.5 L47,73.5"/>
    </g>
    <!-- nodes -->
    <g stroke-width="1.8" fill="#0B0716">
      <circle cx="38.6" cy="29.2" r="2.3"/>
      <circle cx="31.4" cy="35.4" r="2.3"/>
      <circle cx="39.6" cy="50" r="2.3"/>
      <circle cx="29.4" cy="50.4" r="2.3"/>
      <circle cx="38.4" cy="71.6" r="2.3"/>
      <circle cx="44.7" cy="73.5" r="2.3"/>
