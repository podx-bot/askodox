    <path stroke-width="3" d="M52,26.5 C48.5,23.5 42.5,23 39,26.5 C33.5,24.5 27.5,28 27,33.5 C21.5,35 19,40.5 21,45.5 C17,49.5 17,56.5 21,60 C18.5,65.5 21.5,71.5 27.5,72.5 C29,78.5 35,82 41,80 C44.5,82.5 49.5,82.5 52,80"/>
    <path stroke-width="3" d="M52,26.5 L52,80"/>
