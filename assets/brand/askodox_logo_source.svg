      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#brain)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
