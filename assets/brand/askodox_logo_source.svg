  <path fill="url(#arrow)" fill-rule="evenodd" filter="url(#glow)"
        d="M57.5,26.5 L66,26.5 Q69,26.5 70.8,29 L86,51 Q88,54 86,57 L70.8,79 Q69,81.5 66,81.5 L57.5,81.5 Z
