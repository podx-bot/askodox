<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="brain" x1="22" y1="24" x2="54" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E4D6FF"/>
      <stop offset="1" stop-color="#A98BFF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="58" y1="26" x2="88" y2="82" gradientUnits="userSpaceOnUse">
