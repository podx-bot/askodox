name: Probe trust-voice analyze (throwaway)
on:
  push:
    branches: [claude/probe-trust-voice]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze + tests -> annotations
        shell: bash {0}
        run: |
          flutter pub get > pub.txt 2>&1; echo "::notice title=pub::exit $? $(tail -2 pub.txt | tr '\n' ' ')"
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          flutter test --reporter expanded test/features/home test/core test/shared > tests.txt 2>&1 || true
          python3 - <<'PY'
          import re
          a=[l.strip() for l in open('analyze.txt') if re.search(r'(error|warning|info) (-|•)', l)]
          t=open('tests.txt').read().splitlines()
          keep=[]
          for i,l in enumerate(t):
              if re.search(r'\[E\]|Expected:|Actual:|Which:|EXCEPTION CAUGHT|Error:|test/[^ ]+\.dart [0-9]+:[0-9]+', l):
                  keep.append(l.strip()[:300])
          def emit(title, lines):
              chunk=[]
              n=0
              for l in lines:
                  chunk.append(l)
                  if sum(len(x) for x in chunk) > 3000:
                      n+=1; print(f'::warning title={title} {n}::' + ' %0A '.join(chunk)); chunk=[]
              if chunk:
                  n+=1; print(f'::warning title={title} {n}::' + ' %0A '.join(chunk))
          emit('analyze', a[:80] or ['analyze clean'])
          emit('tests', keep[:120] or ['no failures found'])
          print('::notice title=summary::' + ' | '.join(t[-3:]))
          PY
