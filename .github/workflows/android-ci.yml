name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (errors are fatal)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Tests
        run: flutter test --reporter expanded
      - name: Check Android API configuration
        env:
          PODX_API_BASE_URL: ${{ vars.PODX_API_BASE_URL }}
        run: |
          if [ -z "$PODX_API_BASE_URL" ]; then
            echo "::warning::PODX_API_BASE_URL is not set. APK will use the persistent in-app ASKODOX server setting until the repository variable is configured."
            exit 0
          fi
          case "$PODX_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::PODX_API_BASE_URL must be an https:// URL"; exit 1 ;;
          esac
      - name: Ensure Android platform scaffold
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.askodox .
          fi
      - name: Apply ASKODOX Android branding
        shell: bash
        run: bash tool/apply_android_askodox_branding.sh
      - name: Verify ASKODOX Android branding
        shell: bash
        run: |
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -f android/app/src/main/res/drawable/askodox_launcher_foreground.xml
          test -f android/app/src/main/res/drawable/launch_background.xml
          grep -q 'askodox_violet' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '#603EFF' android/app/src/main/res/values/askodox_colors.xml
      - name: Build Android debug APK
        env:
          PODX_API_BASE_URL: ${{ vars.PODX_API_BASE_URL }}
        run: flutter build apk --debug --dart-define=PODX_API_BASE_URL="$PODX_API_BASE_URL"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: askodox-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
