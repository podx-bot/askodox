name: Android CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (errors are fatal)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test --reporter expanded
      - name: Ensure Android platform scaffold
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.askodox .
          fi
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=PODX_API_BASE_URL="${{ vars.PODX_API_BASE_URL }}"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: askodox-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
