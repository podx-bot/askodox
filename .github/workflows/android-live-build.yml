name: Android Live Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub prerelease with the APK
        required: false
        default: false
        type: boolean
      build_number:
        description: Explicit Android build number for the release channel
        required: false
        default: '919'
        type: string
      compare_run_id:
        description: Optional Live Build run id whose signed APK must be updatable by this one (e.g. the build installed on a test phone)
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-live-build.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: android-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://podx-ai-connect-production-3279.up.railway.app' }}
      ANDROID_ORG: ${{ vars.ANDROID_ORG }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute Android build number
        shell: bash
        run: |
          set -euo pipefail
          # A plain push to main has no workflow_dispatch input, so it used to
          # fall back to the literal string '919' on every single push -- every
          # push-triggered live build was labeled build 919 regardless of what
          # code actually changed. That made the in-app updater's own
          # ASKODOX_BUILD_NUMBER comparison useless for detecting a real
          # update: a device already on a "919" install could never see a
          # newer one. github.run_number is this workflow's own monotonically
          # increasing per-run counter, so it is offset by 1000 -- safely past
          # the highest build number ever manually published (920, see the
          # askodox-920/android-920 release history) -- to guarantee every
          # future push-triggered build number is both unique and always
          # greater than any previously installed one. Android refuses to
          # install an update with a lower versionCode, so this must never
          # regress. workflow_dispatch keeps its explicit input (and that
          # input's own '919' default) for manual overrides. This has to be
          # plain shell arithmetic, not a GitHub Actions expression: the
          # expression language has no plus-sign arithmetic operator, and
          # writing the addition directly as a template substitution is
          # invalid syntax that fails the whole workflow at parse time
          # before any job runs (do not paste that template form back into
          # this file, even inside a comment -- the parser evaluates every
          # template substitution in a run block regardless of shell
          # comments).
          INPUT_BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER=$INPUT_BUILD_NUMBER" >> "$GITHUB_ENV"
          else
            echo "BUILD_NUMBER=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          fi

      - name: Validate live build configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo 'API_BASE_URL is required for a live build.' >&2
            exit 1
          fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo 'API_BASE_URL must be an https:// URL.' >&2
            exit 1
          fi
          echo "ANDROID_ORG=${ANDROID_ORG:-com.askodox}" >> "$GITHUB_ENV"

      - name: Verify ASKODOX production backend
        shell: bash
        run: bash tool/verify_v2_backend.sh

      - name: Generate Android host project
        run: flutter create --platforms=android --org "$ANDROID_ORG" --project-name askodox .

      - name: Apply ASKODOX Android branding and in-app updater bridge
        shell: bash
        run: |
          set -euo pipefail
          bash tool/apply_android_askodox_branding.sh
          bash tool/apply_android_live_device_bridge.sh

      - name: Install dependencies and verify
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Build installable debug APK
        run: |
          flutter build apk --debug \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=APP_ENV=staging \
            --dart-define=BACKEND_PROVIDER=rest \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ASKODOX_ENABLE_UPDATES=true \
            --dart-define=ASKODOX_BUILD_NUMBER="${BUILD_NUMBER}"

      - name: Prepare release signing when configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/askodox-release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=askodox-release.jks
          EOF
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          s = s.replace('android {', 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }\n\nandroid {', 1)
          needle = '    buildTypes {\n'
          signing = '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n'''
          s = s.replace(needle, signing + needle, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          # Fail closed: never ship a "release" APK that silently fell back to
          # the runner's throwaway debug key (a different key on every run).
          if 'create("release")' not in s or 'signingConfigs.getByName("release")' not in s \
                  or 'signingConfigs.getByName("debug")' in s:
              raise SystemExit("release signing patch did not apply to android/app/build.gradle.kts")
          p.write_text(s)
          PY
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing secrets are not configured; signed release APK will be skipped.'
          fi

      - name: Build stable signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          flutter build apk --release \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_PROVIDER=rest \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ASKODOX_ENABLE_UPDATES=true \
            --dart-define=ASKODOX_BUILD_NUMBER="${BUILD_NUMBER}"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/askodox-live-${BUILD_NUMBER}-debug.apk"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/askodox-live-${BUILD_NUMBER}.apk"
          fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          # Measured size report (exact bytes + the largest parts of each APK).
          python3 - <<'PY' | tee dist/APK_SIZES.txt
          import glob, os, zipfile
          for path in sorted(glob.glob("dist/*.apk")):
              print(f"{os.path.basename(path)}: {os.path.getsize(path)} bytes ({os.path.getsize(path) / 1048576:.1f} MB)")
              with zipfile.ZipFile(path) as apk:
                  entries = sorted(apk.infolist(), key=lambda e: -e.compress_size)[:12]
                  for e in entries:
                      print(f"  {e.compress_size / 1048576:7.2f} MB  {e.filename}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: askodox-android-${{ github.run_number }}
          path: dist/*
          retention-days: 30

      - name: Verify release signing and update compatibility
        id: verify
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_RUN_ID: ${{ inputs.compare_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Only PUBLIC certificate fingerprints are printed -- never keystore
          # contents or passwords (keytool reads the password from the env).
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          REL="dist/askodox-live-${BUILD_NUMBER}.apk"
          norm() { tr -d ': ' | tr 'A-F' 'a-f'; }
          cert() {
            "$BT/apksigner" verify --print-certs "$1" > /tmp/certs.txt 2>&1 || true
            # "Signer #1 certificate ..." (v3) or "V2 Signer: certificate ..." (v2 only)
            sed -n 's/.*[Ss]igner[^:]*:\{0,1\} *certificate SHA-256 digest: *//p' /tmp/certs.txt | head -n 1 | norm
          }
          badge() { "$BT/aapt2" dump badging "$1" > /tmp/badge.txt 2>/dev/null || true; sed -n 1p /tmp/badge.txt; }
          # First field of "package: name='<id>' versionCode='<n>' ..." (later
          # fields such as platformBuildVersionName='16' must not be matched).
          pkg() { badge "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p"; }
          vcode() { badge "$1" | sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p"; }
          "$BT/apksigner" verify --verbose "$REL" > verify.log
          grep -E 'Verified using|Verifies' verify.log
          # Public certificate details of the release APK (no secrets).
          "$BT/apksigner" verify --print-certs "$REL" 2>&1 | grep -E 'certificate (DN|SHA-256 digest)' | head -n 2 || true
          REL_CERT="$(cert "$REL")"
          # Public fingerprint of the ASKODOX release key (keytool reads the
          # store password from the environment; only fingerprints printed).
          keytool -list -v -keystore android/app/askodox-release.jks -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            > /tmp/keystore.txt 2>&1 || true
          KEY_CERT="$(sed -n 's/^[[:space:]]*SHA256: *//p' /tmp/keystore.txt | head -n 1 | norm)"
          if [ -z "$KEY_CERT" ]; then
            echo "keytool could not read the release keystore certificate:"
            grep -iE 'error|exception' /tmp/keystore.txt | sed 's/password[^ ]*/[redacted]/Ig' | head -n 3 || true
          fi
          [ -n "$REL_CERT" ] || { echo "FAIL: could not read the release APK certificate"; sed -n 1,5p /tmp/certs.txt; exit 1; }
          [ -n "$(pkg "$REL")" ] && [ -n "$(vcode "$REL")" ] || { echo "FAIL: could not read package / versionCode"; badge "$REL"; exit 1; }
          [ -n "$KEY_CERT" ] || { echo "FAIL: could not read the release keystore certificate"; exit 1; }
          {
            echo "APK: $(basename "$REL")"
            echo "package: $(pkg "$REL")"
            echo "versionCode: $(vcode "$REL")"
            echo "certificate SHA-256: $REL_CERT"
            echo "ASKODOX release keystore certificate SHA-256: $KEY_CERT"
          } | tee VERIFICATION.txt
          if [ "$REL_CERT" != "$KEY_CERT" ]; then
            echo "FAIL: release APK is not signed with the ASKODOX release key" | tee -a VERIFICATION.txt
            exit 1
          fi
          # The production in-app update APK (main) must share key + package.
          mkdir -p ref
          if gh release download askodox-latest -p askodox-latest.apk -D ref --clobber 2>/dev/null; then
            {
              echo "production askodox-latest.apk: package $(pkg ref/askodox-latest.apk), versionCode $(vcode ref/askodox-latest.apk), certificate $(cert ref/askodox-latest.apk)"
            } | tee -a VERIFICATION.txt
            [ "$(cert ref/askodox-latest.apk)" = "$REL_CERT" ] || { echo "FAIL: certificate differs from production" | tee -a VERIFICATION.txt; exit 1; }
            [ "$(pkg ref/askodox-latest.apk)" = "$(pkg "$REL")" ] || { echo "FAIL: package differs from production" | tee -a VERIFICATION.txt; exit 1; }
          else
            echo "WARN: production askodox-latest.apk not found for comparison" | tee -a VERIFICATION.txt
          fi
          # The build installed on the test phone (optional run id).
          if [ -n "${COMPARE_RUN_ID:-}" ]; then
            mkdir -p baseline
            gh run download "$COMPARE_RUN_ID" --dir baseline
            BASE="$(find baseline -name '*.apk' ! -name '*-debug.apk' | head -1)"
            [ -n "$BASE" ] || { echo "FAIL: no signed APK in run $COMPARE_RUN_ID" | tee -a VERIFICATION.txt; exit 1; }
            echo "installed baseline $(basename "$BASE"): package $(pkg "$BASE"), versionCode $(vcode "$BASE"), certificate $(cert "$BASE")" | tee -a VERIFICATION.txt
            [ "$(cert "$BASE")" = "$REL_CERT" ] || { echo "FAIL: certificate differs from the installed build" | tee -a VERIFICATION.txt; exit 1; }
            [ "$(pkg "$BASE")" = "$(pkg "$REL")" ] || { echo "FAIL: package differs from the installed build" | tee -a VERIFICATION.txt; exit 1; }
            [ "$(vcode "$REL")" -gt "$(vcode "$BASE")" ] || { echo "FAIL: versionCode is not higher than the installed build" | tee -a VERIFICATION.txt; exit 1; }
          fi
          echo "PASS: signed with the ASKODOX release key; installs over builds with the same package and a lower versionCode" | tee -a VERIFICATION.txt
          mkdir -p phone-test
          cp "$REL" phone-test/
          cp VERIFICATION.txt phone-test/

      - name: Upload verified phone-test APK
        if: steps.signing.outputs.configured == 'true' && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: askodox-phone-test-${{ env.BUILD_NUMBER }}
          path: phone-test/*
          retention-days: 30

      - name: Publish ASKODOX in-app update channel
        # Only merged code reaches users' phones: a build started by hand on
        # a PR branch keeps its APK as a workflow artifact for testing.
        if: steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="askodox-latest"
          VERSION="1.0.${BUILD_NUMBER}"
          cp "dist/askodox-live-${BUILD_NUMBER}.apk" "dist/askodox-${BUILD_NUMBER}.apk"
          cp "dist/askodox-live-${BUILD_NUMBER}.apk" dist/askodox-latest.apk
          cat > dist/latest.json <<EOF
          {
            "version": "${VERSION}",
            "build_number": ${BUILD_NUMBER},
            "mandatory": false,
            "notes": "Latest ASKODOX update",
            "apk_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/askodox-${BUILD_NUMBER}.apk"
          }
          EOF
          # Harden the moving update channel against a stale/dangling tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "ASKODOX ${VERSION}" --notes "ASKODOX in-app update channel"
          else
            git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "ASKODOX ${VERSION}" --notes "ASKODOX in-app update channel"
          fi
          gh release upload "$TAG" \
            "dist/askodox-${BUILD_NUMBER}.apk" \
            dist/askodox-latest.apk \
            dist/latest.json \
            --clobber
          cat > release-notes.txt <<EOF
          ASKODOX_BUILD_NUMBER=${BUILD_NUMBER}
          ASKODOX_VERSION=${VERSION}
          Latest signed ASKODOX in-app update.
          EOF
          gh release edit "$TAG" --title "ASKODOX ${VERSION}" --notes-file release-notes.txt
          gh release view "$TAG" --json tagName,url,assets --jq '.tagName, .url, (.assets[].name)'

      - name: Publish prerelease download link
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.signing.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-${BUILD_NUMBER}"
          gh release create "$TAG" "dist/askodox-live-${BUILD_NUMBER}.apk" dist/SHA256SUMS.txt --prerelease --title "ASKODOX Android ${BUILD_NUMBER}" --notes "Live ASKODOX Android build. Existing installs can update only when the application ID and signing certificate match."
