name: Vendor backend into ASKODOX monorepo

on:
  push:
    branches:
      - migration/backend-monorepo
    paths:
      - .github/workflows/vendor-backend-monorepo.yml

permissions:
  contents: write

jobs:
  vendor-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ASKODOX migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/backend-monorepo
          fetch-depth: 0

      - name: Clone pinned legacy backend source
        run: |
          set -euxo pipefail
          rm -rf /tmp/podx-v2
          git clone --no-checkout https://github.com/podx-bot/podx-ai-connect-v2.git /tmp/podx-v2
          cd /tmp/podx-v2
          git checkout 915327953098ab64ecedcfd9553580bbf48f8af1

      - name: Vendor complete backend source
        run: |
          set -euxo pipefail
          rm -rf backend/app
          mkdir -p backend
          cp -a /tmp/podx-v2/app backend/app
          cp /tmp/podx-v2/server.py backend/server.py
          cp /tmp/podx-v2/requirements.txt backend/requirements.txt
          cp /tmp/podx-v2/Dockerfile backend/Dockerfile
          cp /tmp/podx-v2/railway.json backend/railway.json
          cp /tmp/podx-v2/.env.example backend/.env.example
          cp /tmp/podx-v2/.dockerignore backend/.dockerignore

      - name: Commit exact backend snapshot
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "Backend snapshot already matches pinned source."
          else
            git commit -m "Vendor complete backend from pinned V2 snapshot"
            git push origin HEAD:migration/backend-monorepo
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/server.py

      - name: Import FastAPI app
        working-directory: backend
        env:
          PODX_DATABASE_PATH: /tmp/askodox-migration.db
        run: |
          python - <<'PY'
          import server
          print(server.app.title)
          print(server.app.version)
          PY
