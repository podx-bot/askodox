name: Firebase SMS receiver A/B (emulator, temporary)

# Proves (or refutes) the APK 1339 crash: Firebase Auth's own SMS receiver
# vs the SMS User Consent broadcast, with auto-retrieval on (60 s) and off (0).
on:
  push:
    branches: [claude/firebase-receiver-ab]

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        timeout: ['60', '0']
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Firebase config (values never printed)
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: python3 tool/firebase_android_config.py write --require
      - name: Build probe
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --debug -t integration_test/firebase_receiver_probe_main.dart \
            --dart-define=PROBE_TIMEOUT_SECONDS=${{ matrix.timeout }} \
            --dart-define=FIREBASE_API_KEY="${FIREBASE_API_KEY}" \
            --dart-define=FIREBASE_APP_ID="${FIREBASE_APP_ID}" \
            --dart-define=FIREBASE_SENDER_ID="${FIREBASE_SENDER_ID}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}"
          cp build/app/outputs/flutter-apk/app-debug.apk probe.apk
          cat > ab.sh <<'SH'
          set -u
          T=${{ matrix.timeout }}
          PKG=com.askodox.askodox
          adb install -r probe.apk
          adb logcat -c
          adb shell am start -W -n $PKG/.MainActivity
          for i in $(seq 1 40); do adb logcat -d | grep -q "ASKODOX_PROBE consent_start" && break; sleep 2; done
          sleep 8
          # A browser (reCAPTCHA) may have come in front: bring the probe back.
          adb shell am start -W -n $PKG/.MainActivity >/dev/null
          sleep 3
          adb emu sms send 5551234 "482915 is your verification code for askodox-81252.firebaseapp.com."
          sleep 15
          adb shell am start -W -n $PKG/.MainActivity >/dev/null
          sleep 10
          pid=$(adb shell pidof $PKG || true)
          crash=$(adb logcat -d | grep -E "FATAL EXCEPTION|E AndroidRuntime" | grep -c . || true)
          echo "::notice title=timeout=$T probe::$(adb logcat -d | grep -o 'ASKODOX_PROBE.*' | tr '\n' ';')"
          adb logcat -d | grep -A12 "FATAL EXCEPTION" | grep -E "Exception|at " | head -8 | cut -c1-200 | sed "s/^/::warning title=timeout=$T crash::/"
          echo "::notice title=timeout=$T result::app process ${pid:-GONE}; crash lines $crash"
          SH
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ab.sh
