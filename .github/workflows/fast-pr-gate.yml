name: Fast PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: fast-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      backend: ${{ steps.filter.outputs.backend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
            backend:
              - 'backend/**'
            ci:
              - '.github/workflows/**'

  flutter-fast:
    name: Flutter fast checks
    needs: classify
    if: needs.classify.outputs.flutter == 'true' || needs.classify.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub

  backend-fast:
    name: Backend fast checks
    needs: classify
    if: needs.classify.outputs.backend == 'true' || needs.classify.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          if [ -d tests ]; then python -m pytest -q; else python -m compileall app; fi

  gate:
    name: Fast PR Gate
    if: always()
    needs: [classify, flutter-fast, backend-fast]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required fast checks
        env:
          CLASSIFY: ${{ needs.classify.result }}
          FLUTTER: ${{ needs.flutter-fast.result }}
          BACKEND: ${{ needs.backend-fast.result }}
        run: |
          test "$CLASSIFY" = "success"
          for result in "$FLUTTER" "$BACKEND"; do
            test "$result" = "success" || test "$result" = "skipped"
          done
