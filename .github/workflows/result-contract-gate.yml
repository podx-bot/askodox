name: Result contract gate

# The ONE canonical result contract: 20 combination regressions (sources add,
# never replace; failures stay in their own section; explicit constraints
# survive turns; no false "showing options"). Runs on every backend change.
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/result-contract-gate.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/result-contract-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combinations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install -q -r backend/requirements.txt pytest
      - name: Result contract combinations + discovery regressions
        working-directory: backend
        run: |
          python -m pytest -q -p no:warnings \
            tests/test_result_contract_combinations.py \
            tests/test_web_search_chain.py \
            tests/test_unified_chat_results.py \
            tests/test_universal_multi_source_results.py \
            tests/test_real_phone_regressions.py \
            tests/test_search_resilience.py \
            tests/test_sources_workspace_early_access.py
