name: Prod health probe (read-only)
on:
  push:
    branches: [claude/prod-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GET only
        run: |
          B=https://podx-ai-connect-production-3279.up.railway.app
          for p in /health /api/billing/options /api/billing/purchases/mine /admin/cc/billing/status '/billing/pay/bp_none?t=1.bad' '/api/billing/pay/bp_none/status?t=1.bad'; do
            code=$(curl -s -o body.txt -w '%{http_code}' "$B$p")
            echo "::notice title=$p::HTTP $code $(head -c 300 body.txt | tr '\n' ' ')"
          done
          curl -s "$B/health/integrations" -o integ.txt
          python3 -c "import json;r=[i for i in json.load(open('integ.txt'))['items'] if i['integration']=='Razorpay'];print('::notice title=Razorpay row::'+json.dumps(r))"
