name: Prod health probe (read-only)
on:
  push:
    branches: [claude/prod-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Auth + push endpoints (no real OTP is sent, nothing is changed)
        run: |
          B=https://podx-ai-connect-production-3279.up.railway.app
          n() { echo "::notice title=$1::HTTP $2 $(head -c 260 b.txt)"; }
          code=$(curl -s -o b.txt -w '%{http_code}' "$B/health"); n "GET /health" $code
          code=$(curl -s -o b.txt -w '%{http_code}' "$B/onboarding/methods"); n "GET /onboarding/methods" $code
          # Invalid numbers are refused before any delivery (no SMS / WhatsApp is sent).
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/onboarding/otp/send" -H 'Content-Type: application/json' --data '{"mobile":"12345"}'); n "POST otp/send invalid number" $code
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/onboarding/otp/verify" -H 'Content-Type: application/json' --data '{"mobile":"+919000000001","otp":"123"}'); n "POST otp/verify short code" $code
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/onboarding/otp/verify" -H 'Content-Type: application/json' --data '{"mobile":"+919000000001","otp":"123456"}'); n "POST otp/verify without a sent code" $code
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/onboarding/firebase/verify" -H 'Content-Type: application/json' --data '{"id_token":"a.b.c"}'); n "POST firebase/verify forged" $code
          code=$(curl -s -o b.txt -w '%{http_code}' "$B/api/me/session"); n "GET /api/me/session no token" $code
          code=$(curl -s -o b.txt -w '%{http_code}' "$B/api/me/session" -H 'Authorization: Bearer forged.token'); n "GET /api/me/session forged token" $code
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/api/me/logout" -H 'Content-Type: application/json' --data '{}'); n "POST /api/me/logout no token" $code
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/api/me/push-test"); n "POST /api/me/push-test no token" $code
          code=$(curl -s -o b.txt -w '%{http_code}' -X POST "$B/api/me/push-token" -H 'Content-Type: application/json' --data '{"token":"xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"}'); n "POST /api/me/push-token no token" $code
          curl -s "$B/health/integrations" -o i.txt
          python3 -c "import json;r=[i for i in json.load(open('i.txt'))['items'] if i['integration'] in ('Sign-in OTP',) or 'irebase' in i['integration'] or 'ush' in i['integration']];print('::notice title=OTP / Firebase / push rows::'+json.dumps(r))"
