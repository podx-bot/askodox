name: Prod health probe (read-only)
on:
  push:
    branches: [claude/prod-health-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GET only
        run: |
          B=https://podx-ai-connect-production-3279.up.railway.app
          for p in /health /readiness /api/plans /api/plans/catalogue /api/catalog/templates /api/catalog/filters/pickles /api/radio/status /admin/cc/axe/brief /admin/cc/radio /admin/cc/push/readiness /admin/cc/growth/billing-readiness; do
            code=$(curl -s -o body.txt -w '%{http_code}' "$B$p")
            echo "::notice title=$p::HTTP $code $(head -c 300 body.txt | tr '\n' ' ')"
          done
