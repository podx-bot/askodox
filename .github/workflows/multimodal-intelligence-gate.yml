name: Multimodal Intelligence Gate

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/api/routes/vision.py'
      - 'backend/app/api/app_factory.py'
      - 'backend/app/services/universal_image_service.py'
      - 'lib/services/vision_api_service.dart'
      - 'lib/services/multimodal_capture_service.dart'
      - 'lib/features/search/application/product_discovery_controller.dart'
      - 'lib/features/search/presentation/product_discovery_screen.dart'
      - 'lib/features/home/presentation/home_screen.dart'
      - '.github/workflows/multimodal-intelligence-gate.yml'
  pull_request:
    paths:
      - 'backend/app/api/routes/vision.py'
      - 'backend/app/api/app_factory.py'
      - 'backend/app/services/universal_image_service.py'
      - 'lib/services/vision_api_service.dart'
      - 'lib/services/multimodal_capture_service.dart'
      - 'lib/features/search/application/product_discovery_controller.dart'
      - 'lib/features/search/presentation/product_discovery_screen.dart'
      - 'lib/features/home/presentation/home_screen.dart'
      - '.github/workflows/multimodal-intelligence-gate.yml'
  workflow_dispatch:

jobs:
  multimodal-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies
        run: pip install fastapi pydantic
      - name: Verify registered vision endpoint and structured analysis
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from types import SimpleNamespace
          from fastapi import HTTPException
          from app.api.routes.vision import VisionAnalyzeRequest, analyze_vision

          class FakeImageService:
              def analyze(self, image_bytes, mime_type, caption):
                  assert image_bytes == b'askodox-image'
                  assert mime_type == 'image/png'
                  assert caption == 'find this nearby'
                  return {
                      'side': 'NEED',
                      'domain': 'PRODUCT',
                      'subject': 'test product',
                      'visible_text': 'ASKODOX TEST LABEL',
                      'confidence': 0.99,
                  }

          request = SimpleNamespace(
              app=SimpleNamespace(
                  state=SimpleNamespace(
                      container=SimpleNamespace(universal_image_service=FakeImageService())
                  )
              )
          )
          payload = VisionAnalyzeRequest(
              image_base64=base64.b64encode(b'askodox-image').decode('ascii'),
              mime_type='image/png',
              user_text='find this nearby',
              language='en',
          )
          result = analyze_vision(payload, request)
          assert result['status'] == 'success'
          assert result['analysis']['subject'] == 'test product'
          assert result['analysis']['side'] == 'NEED'
          assert result['analysis']['visible_text'] == 'ASKODOX TEST LABEL'

          try:
              analyze_vision(
                  VisionAnalyzeRequest(
                      image_base64='not-base64!!',
                      mime_type='image/jpeg',
                      user_text='',
                      language='en',
                  ),
                  request,
              )
              raise AssertionError('invalid base64 must fail')
          except HTTPException as exc:
              assert exc.status_code == 400

          app_factory = Path('app/api/app_factory.py').read_text(encoding='utf-8')
          image_service = Path('app/services/universal_image_service.py').read_text(encoding='utf-8')
          vision_route = Path('app/api/routes/vision.py').read_text(encoding='utf-8')
          assert 'from app.api.routes.vision import router as vision_router' in app_factory
          assert 'app.include_router(vision_router)' in app_factory
          assert 'def analyze(' in image_service
          assert 'image_service.analyze(' in vision_route
          assert 'image_service._analyze_multi_ai(' not in vision_route
          assert 'ASKODOX universal visual intelligence' in image_service
          assert '\\"visible_text\\":string|null' in image_service
          assert 'PODX visual commerce brain' not in image_service

          root = Path('..')
          controller = (root / 'lib/features/search/application/product_discovery_controller.dart').read_text(encoding='utf-8')
          capture = (root / 'lib/services/multimodal_capture_service.dart').read_text(encoding='utf-8')
          vision_client = (root / 'lib/services/vision_api_service.dart').read_text(encoding='utf-8')
          screen = (root / 'lib/features/search/presentation/product_discovery_screen.dart').read_text(encoding='utf-8')

          assert 'extractMockText' not in controller
          assert 'local://pending-product-image.jpg' not in controller
          assert 'capture.captureCamera()' in controller
          assert 'capture.chooseGallery()' in controller
          assert 'visionApiServiceProvider' in controller
          assert '/vision/analyze' in vision_client
          assert 'ImageSource.camera' in capture
          assert 'ImageSource.gallery' in capture
          assert ".runOcr('camera')" in screen
          assert ".runOcr('gallery')" in screen
          assert '.uploadImage()' in screen
          assert 'Camera OCR is being connected' not in screen
          assert 'Image understanding is being connected' not in screen
          assert 'String _visionText(Map<String, dynamic> analysis)' in controller
          for field in ('visible_text', 'subject', 'brand', 'model', 'quantity', 'price', 'location_text', 'constraints'):
              assert f"'{field}'" in controller, f'missing structured vision field: {field}'
          assert controller.count('universalDealControllerProvider.notifier') >= 3
          assert 'startVoiceSearch' in controller
          assert 'voicePreference' in controller
          assert 'languageCode' in controller

          print('MULTIMODAL INTELLIGENCE GATE: PASS')
          PY
