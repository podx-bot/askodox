name: Android APK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.askodox .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        env:
          PODX_API_BASE_URL: ${{ vars.PODX_API_BASE_URL }}
        run: |
          if [ -n "$PODX_API_BASE_URL" ]; then
            flutter build apk --release \
              --dart-define=APP_ENV=production \
              --dart-define=BACKEND_PROVIDER=rest \
              --dart-define=API_BASE_URL="$PODX_API_BASE_URL"
          else
            echo "PODX_API_BASE_URL repository variable is not set; building safe mock APK."
            flutter build apk --debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: askodox-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
