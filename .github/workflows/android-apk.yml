name: Android APK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Compile check only. This job has no release key, so it never produces
      # or uploads a "release" APK: one signed with the runner's throwaway
      # debug key (versionCode 1) cannot update an installed ASKODOX and
      # Android answers "App not installed". Installable builds come only
      # from Android Live Build (persistent release key, guarded).
      - name: Build debug APK (compile check, not distributed)
        run: flutter build apk --debug
      - name: Release builds refuse to run without the ASKODOX release key
        run: |
          if flutter build apk --release > release-attempt.log 2>&1; then
            echo "FAIL: a release APK was built without the ASKODOX release key" >&2; exit 1
          fi
          grep -q "ASKODOX release signing is not configured" release-attempt.log
