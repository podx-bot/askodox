name: universal-ai-assistant-smoke

on:
  push:
    paths:
      - 'backend/app/services/universal_ai_assistant_service.py'
      - 'backend/app/services/runtime_readiness_service.py'
      - 'backend/app/core/settings.py'
      - 'backend/app/api/app_factory.py'
      - 'backend/app/api/routes/in_app_assistant.py'
      - 'backend/app/api/routes/health.py'
      - '.github/workflows/universal-ai-assistant-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Verify structured AI routing and safe fallback
        run: |
          python - <<'PY'
          import json
          from types import SimpleNamespace

          from app.services.runtime_readiness_service import RuntimeReadinessService
          from app.services.universal_ai_assistant_service import UniversalAIAssistantService

          class Delegate:
              def __init__(self):
                  self.messages = []
              def process(self, sender_mobile, message):
                  self.messages.append((sender_mobile, message))
                  return 'DELEGATE:' + message

          class Models:
              def __init__(self, payload=None, fail=False):
                  self.payload = payload or {
                      'reply': 'మీకు 10 మంది catering staff కావాలి.',
                      'domain': 'STAFFING',
                      'transactional': True,
                      'action': 'find_temporary_staff',
                      'confidence': 0.97,
                  }
                  self.fail = fail
                  self.calls = []
              def generate_content(self, **kwargs):
                  self.calls.append(kwargs)
                  if self.fail:
                      raise RuntimeError('provider down')
                  return SimpleNamespace(text=json.dumps(self.payload, ensure_ascii=False))

          class Client:
              def __init__(self, models):
                  self.models = models

          delegate = Delegate()
          models = Models()
          service = UniversalAIAssistantService(
              delegate,
              api_key='test-key',
              model='gemini-text-test',
              client=Client(models),
          )

          decision = service.decide(
              'catering boys kavali repu 11 am ki 10 members',
              history=[{'role': 'user', 'text': 'repu function undi'}],
              locale='te',
          )
          assert decision['domain'] == 'STAFFING'
          assert decision['transactional'] is True
          assert decision['action'] == 'find_temporary_staff'
          assert decision['confidence'] == 0.97
          assert len(models.calls) == 1
          call = models.calls[0]
          assert call['model'] == 'gemini-text-test'
          assert 'keyword matching' in call['contents']
          assert 'delivery job kavali' in call['contents']
          assert 'delivery boys/staff kavali na shop ki' in call['contents']
          assert call['config'].response_mime_type == 'application/json'

          general_models = Models({
              'reply': 'సరే, మీ రోజు ప్లాన్ చేద్దాం.',
              'domain': 'GENERAL',
              'transactional': False,
              'action': 'plan_day',
              'confidence': 0.96,
          })
          general_service = UniversalAIAssistantService(
              delegate,
              api_key='test-key',
              model='gemini-text-test',
              client=Client(general_models),
          )
          general = 'OASAT domain=GENERAL; User request: ఈ రోజు పనులు ప్లాన్ చేయి'
          assert general_service.process('u1', general) == 'సరే, మీ రోజు ప్లాన్ చేద్దాం.'

          commerce = 'OASAT domain=COMMERCE; User request: Buy chicken nearby'
          assert service.process('u1', commerce).startswith('DELEGATE:')

          fallback = UniversalAIAssistantService(delegate, api_key='', model='gemini-text-test')
          assert fallback.decide('hello') is None
          assert fallback.process('u2', general).startswith('DELEGATE:')

          failing = UniversalAIAssistantService(
              delegate,
              api_key='test-key',
              model='gemini-text-test',
              client=Client(Models(fail=True)),
          )
          assert failing.decide('hello') is None
          assert failing.process('u3', general).startswith('DELEGATE:')

          ready_settings = SimpleNamespace(
              whatsapp_access_token='x', whatsapp_phone_number_id='y', whatsapp_webhook_verify_token='z',
              sarvam_api_key='', gemini_api_key='gemini-key', gemini_text_model='gemini-text-test',
              openai_api_key='', voice_reply_enabled=False, google_maps_api_key='', brave_search_api_key='brave-key')
          readiness = RuntimeReadinessService(ready_settings).check()
          assert readiness.universal_ai_ready is True

          no_text_model = SimpleNamespace(**{**ready_settings.__dict__, 'gemini_text_model': ''})
          degraded = RuntimeReadinessService(no_text_model).check()
          assert degraded.universal_ai_ready is False
          assert any('Universal AI assistant' in warning for warning in degraded.warnings)

          print('structured universal AI routing smoke passed')
          PY