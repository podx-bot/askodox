name: tmp voice fetch (throwaway)
on:
  push:
    branches: [claude/tmp-voice-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f tmp_voice/voice.mp3 ]; then echo "already fetched"; exit 0; fi
          mkdir -p tmp_voice
          curl -sSfL -o tmp_voice/voice.mp3 "https://elevenlabsusercontent.com/database/workspace/c249b5cf8027417abd6a3ad0f8615bc9/content_generation/2Q3nrFKeTYPxfY9NENsA/bFhefiz44eVgwZ7rY38W/content.mp3?Expires=1794286800&KeyName=assets-cdn-key-1&Signature=4pPt7G5MLqLZWTlC2EPyjqLPmik="
          git config user.name "askodox-bot"; git config user.email "actions@users.noreply.github.com"
          git add tmp_voice/voice.mp3 && git commit -m "tmp: generated voice file" && git push
