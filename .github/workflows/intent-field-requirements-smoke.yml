name: ASKODOX intent field requirements smoke

on:
  push:
    branches: [main]
    paths:
      - backend/app/core/domain_field_requirements.py
      - backend/app/core/default_intent_rules.py
      - backend/app/core/intent_domain_router.py
      - backend/app/core/domain_module_registry.py
      - backend/app/core/routed_intent_flow.py
      - backend/app/api/routes/universal_deals.py
      - .github/workflows/intent-field-requirements-smoke.yml
  pull_request:
    branches: [main]
    paths:
      - backend/app/core/domain_field_requirements.py
      - backend/app/core/default_intent_rules.py
      - backend/app/core/intent_domain_router.py
      - backend/app/core/domain_module_registry.py
      - backend/app/core/routed_intent_flow.py
      - backend/app/api/routes/universal_deals.py
      - .github/workflows/intent-field-requirements-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify routed intent field requirements
        run: |
          python - <<'PY'
          from backend.app.core.default_intent_rules import build_default_intent_router
          from backend.app.core.domain_field_requirements import missing_fields

          router = build_default_intent_router()

          cases = [
              ("I want to buy a laptop", {"subject": "laptop"}, ("location",)),
              ("Need a house for rent", {"subject": "house", "location": "Vijayawada"}, ("timing",)),
              ("Book appointment with doctor", {"subject": "doctor", "location": "nearby"}, ("timing",)),
              ("Send parcel to Hyderabad", {"to_location": "Hyderabad"}, ("from_location", "timing")),
              ("File a complaint about billing", {"subject": "billing"}, ("issue",)),
              ("How to apply for scholarship", {"subject": "scholarship"}, ("applicant_context",)),
              ("I have a doubt about this bill", {"subject": "bill"}, ("question",)),
          ]

          for text, payload, expected_missing in cases:
              route = router.route(text)
              assert missing_fields(route.domain, route.action, payload) == expected_missing

          route = router.route("I want to sell my phone")
          assert missing_fields(route.domain, route.action, {"subject": "phone", "location": "Guntur"}) == ()
          print("routed intent field requirements smoke passed")
          PY

      - name: Verify collect then dispatch flow
        run: |
          python - <<'PY'
          from backend.app.core.default_intent_rules import build_default_intent_router
          from backend.app.core.domain_module_registry import DomainModuleRegistry
          from backend.app.core.routed_intent_flow import RoutedIntentFlow

          registry = DomainModuleRegistry()
          registry.register(
              "commerce",
              lambda payload: f"buy:{payload['subject']}:{payload['location']}",
              action="buy",
          )
          registry.register(
              "assistance",
              lambda payload: f"complaint:{payload['subject']}:{payload['issue']}",
              action="complaint",
          )

          flow = RoutedIntentFlow(build_default_intent_router(), registry)

          incomplete = flow.execute_when_ready(
              "I want to buy a laptop",
              {"subject": "laptop"},
          )
          assert incomplete.ready is False
          assert incomplete.missing == ("location",)
          assert incomplete.output is None

          complete = flow.execute_when_ready(
              "I want to buy a laptop",
              {"subject": "laptop", "location": "Vijayawada"},
          )
          assert complete.ready is True
          assert complete.missing == ()
          assert complete.output == "buy:laptop:Vijayawada"

          complaint = flow.execute_when_ready(
              "File a complaint about billing",
              {"subject": "billing", "issue": "charged twice"},
          )
          assert complaint.ready is True
          assert complaint.output == "complaint:billing:charged twice"

          print("collect then dispatch flow smoke passed")
          PY

      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Verify universal deal intent boundary
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from app.api.routes.universal_deals import (
              UniversalDealCreateRequest,
              _deal_progressed,
              _intent_context,
          )

          class FakeExtractor:
              def __init__(self, request):
                  self.request = request
                  self.calls = 0

              def extract(self, text):
                  self.calls += 1
                  return {"success": True, "request": dict(self.request)}

          buy = UniversalDealCreateRequest(
              user_id="app-smoke",
              raw_text="I want to buy a laptop",
              subject="laptop",
          )
          context = _intent_context(buy)
          assert context is not None
          assert context["domain"] == "commerce"
          assert context["action"] == "buy"
          assert context["missing_fields"] == ["location"]

          extractor = FakeExtractor({
              "subject": "laptop",
              "location_text": "Vijayawada",
              "when_text": None,
          })
          raw_only = UniversalDealCreateRequest(
              user_id="app-smoke",
              raw_text="I want to buy a laptop in Vijayawada",
          )
          context = _intent_context(raw_only, extractor=extractor)
          assert context is not None
          assert context["missing_fields"] == []
          assert extractor.calls == 1

          complete_payload_extractor = FakeExtractor({"subject": "should not be used"})
          complete_payload = UniversalDealCreateRequest(
              user_id="app-smoke",
              raw_text="I want to buy a laptop in Vijayawada",
              subject="laptop",
              location={"label": "Vijayawada"},
          )
          context = _intent_context(complete_payload, extractor=complete_payload_extractor)
          assert context is not None
          assert context["missing_fields"] == []
          assert complete_payload_extractor.calls == 0

          parcel = UniversalDealCreateRequest(
              user_id="app-smoke",
              raw_text="Send parcel to Hyderabad",
              dynamic_fields={"to_location": "Hyderabad"},
          )
          context = _intent_context(parcel)
          assert context is not None
          assert context["domain"] == "parcel"
          assert context["action"] == "send"
          assert context["missing_fields"] == ["from_location", "timing"]

          flutter_parcel = UniversalDealCreateRequest(
              user_id="app-smoke",
              raw_text="Send parcel to Hyderabad",
              timing="today",
              dynamic_fields={"from": "Vijayawada", "to": "Hyderabad"},
          )
          context = _intent_context(flutter_parcel)
          assert context is not None
          assert context["domain"] == "parcel"
          assert context["action"] == "send"
          assert context["missing_fields"] == []

          base = {
              "id": 7,
              "side": "NEED",
              "domain": "PRODUCT",
              "subject": "laptop",
              "quantity": None,
              "unit": None,
              "price": None,
              "currency": "INR",
              "when_text": None,
              "location_text": None,
              "latitude": None,
              "longitude": None,
              "status": "ACTIVE",
          }
          assert _deal_progressed(base, dict(base)) is False
          location_followup = dict(base, location_text="Vijayawada")
          assert _deal_progressed(base, location_followup) is True
          revised = dict(base, id=8, quantity=2.0, unit="kg")
          assert _deal_progressed(base, revised) is True
          assert _deal_progressed(None, base) is True
          assert _deal_progressed(base, None) is False

          unknown = UniversalDealCreateRequest(
              user_id="app-smoke",
              raw_text="hello there",
          )
          assert _intent_context(unknown) is None
          print("universal deal intent boundary smoke passed")
          PY
