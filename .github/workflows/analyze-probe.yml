name: Analyze probe (temporary, diagnostics only)
on:
  push:
    branches: [claude/analyze-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze -> annotations
        run: |
          flutter analyze > analyze.txt 2>&1 || true
          grep -E "^\s*(error|warning|info) " analyze.txt | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          echo "::notice::issues=$(grep -c -E '^\s*(error|warning|info) ' analyze.txt)"
      - name: Tests -> annotations
        run: |
          flutter test -r expanded > test.txt 2>&1 || true
          grep -n -E "\[E\]$" test.txt | head -20 | while IFS= read -r l; do echo "::warning::FAILED $l"; done
          grep -A14 "EXCEPTION CAUGHT" test.txt | head -60 | while IFS= read -r l; do echo "::warning::$l"; done
          tail -2 test.txt | while IFS= read -r l; do echo "::notice::$l"; done
