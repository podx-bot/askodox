name: Test probe (temporary, diagnostics only)
on:
  push:
    branches: [claude/analyze-probe-2]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze + tests -> annotations
        run: |
          flutter analyze > an.txt 2>&1 || true
          grep -E "^\s*(info|warning|error) " an.txt | head -20 | cut -c1-240 | while IFS= read -r l; do echo "::warning::AN $l"; done
          tail -1 an.txt | while IFS= read -r l; do echo "::notice::AN $l"; done
          flutter test > t.txt 2>&1 || true
          grep -B3 -A14 "EXCEPTION CAUGHT\|Expected:" t.txt | grep -v "package:flutter_test\|dart:async\|package:stack_trace\|package:test_api\|<asynchronous" | head -70 | cut -c1-240 | while IFS= read -r l; do echo "::warning::$l"; done
          grep -E "\(failed\)" t.txt | sed 's/.*askodox\/test\///' | cut -c1-240 | while IFS= read -r l; do echo "::warning::FAIL $l"; done
          grep -A2 "error-causing widget was" t.txt | grep -v "error-causing" | sort | uniq -c | head -10 | cut -c1-240 | while IFS= read -r l; do echo "::warning::WIDGET $l"; done
          grep -E "^Expected:|^  Actual:|^   Which:" t.txt | head -30 | cut -c1-240 | while IFS= read -r l; do echo "::warning::EXP $l"; done
          tail -2 t.txt | while IFS= read -r l; do echo "::notice::T $l"; done
      - name: Screens -> release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flutter test test/screens/profile_screenshot_test.dart > s.txt 2>&1 || true
          tail -3 s.txt | while IFS= read -r l; do echo "::notice::S $l"; done
          ls screens || true
          gh release view probe-screens -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create probe-screens -R "$GITHUB_REPOSITORY" --prerelease --latest=false --title "probe screens (temporary)" --notes "temporary UI screenshots"
          grep -E "\(failed\)|error-causing widget|^Expected:|^  Actual:|overflowed|Test failed|══╡" -A3 t.txt | head -400 > failures.txt || true
          gh release upload probe-screens screens/*.png failures.txt --clobber -R "$GITHUB_REPOSITORY"
