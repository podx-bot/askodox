name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1655]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45397860511 -R "$GITHUB_REPOSITORY" -n askodox-android-655 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1655.aab
          sha256sum askodox-play-1655.aab
          gh release create play-bundle-1655 askodox-play-1655.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1655" --notes "Play Console upload only (not installable on a phone). 3-step pages batches 1-6 (#434-#440)."
