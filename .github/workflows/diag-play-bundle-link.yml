name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1719]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45813101761 -R "$GITHUB_REPOSITORY" -n askodox-android-719 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1719.aab
          sha256sum askodox-play-1719.aab
          gh release create play-bundle-1719 askodox-play-1719.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1719" --notes "Play Console upload only (not installable on a phone). Guide journey #516: first-open flow, guide session, reminder chips, feature-requests inbox."
