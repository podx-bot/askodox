name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1717]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45788899535 -R "$GITHUB_REPOSITORY" -n askodox-android-717 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1717.aab
          sha256sum askodox-play-1717.aab
          gh release create play-bundle-1717 askodox-play-1717.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1717" --notes "Play Console upload only (not installable on a phone). Items one tile, calculator bill, item photos + Try it (#512-#515), plus earlier rounds since 1708."
