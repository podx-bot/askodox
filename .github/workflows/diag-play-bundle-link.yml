name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1761]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 46117990470 -R "$GITHUB_REPOSITORY" -n askodox-android-761 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1761.aab
          sha256sum askodox-play-1761.aab
          gh release create play-bundle-1761 askodox-play-1761.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1761" --notes "Play Console upload only (not installable on a phone). Includes school kit (#569), rate trend, live stock, measure card voice."
