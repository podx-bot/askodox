name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1696]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45561591049 -R "$GITHUB_REPOSITORY" -n askodox-android-696 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1696.aab
          sha256sum askodox-play-1696.aab
          gh release create play-bundle-1696 askodox-play-1696.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1696" --notes "Play Console upload only (not installable on a phone). One touch strip on Buy / Sell pages (#485) + shop link phase 2 (#482) + earlier main."
