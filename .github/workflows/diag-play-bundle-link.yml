name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1726]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45979925362 -R "$GITHUB_REPOSITORY" -n askodox-android-726 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1726.aab
          sha256sum askodox-play-1726.aab
          gh release create play-bundle-1726 askodox-play-1726.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1726" --notes "Play Console upload only (not installable on a phone). Clear fonts for every Indian script (#528), payment voice page + web fixes (#522, #524, #525)."
