name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1698]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45574385458 -R "$GITHUB_REPOSITORY" -n askodox-android-698 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1698.aab
          sha256sum askodox-play-1698.aab
          gh release create play-bundle-1698 askodox-play-1698.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1698" --notes "Play Console upload only (not installable on a phone). Finance items: answers from the company's document + consented call back (PR #488); also #485 one touch strip."
