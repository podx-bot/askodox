name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1612]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45148994587 -R "$GITHUB_REPOSITORY" -n askodox-android-612 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1612.aab
          sha256sum askodox-play-1612.aab
          gh release create play-bundle-1612 askodox-play-1612.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1612" --notes "Play Console upload only (not installable on a phone). PR #403: Lite mode on a slow / missing net (text first, voice after, photos on tap). PR #400: a bank debit SMS stays a debit whatever the payee is called (Jio recharge)."
