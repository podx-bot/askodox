name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1584]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 44873565803 -R "$GITHUB_REPOSITORY" -n askodox-android-584 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1584.aab
          sha256sum askodox-play-1584.aab
          gh release create play-bundle-1584 askodox-play-1584.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1584" --notes "Play Console upload only (not installable on a phone)."
          echo "::notice::AAB https://github.com/$GITHUB_REPOSITORY/releases/download/play-bundle-1584/askodox-play-1584.aab"
