name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1753]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 46106183917 -R "$GITHUB_REPOSITORY" -n askodox-android-753 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1753.aab
          sha256sum askodox-play-1753.aab
          gh release create play-bundle-1753 askodox-play-1753.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1753" --notes "Play Console upload only (not installable on a phone). Main 7493ad6: kitchen stock, bills and warranty vault, agent team, guide session finish, test-sweep fixes (#545-#566)."
