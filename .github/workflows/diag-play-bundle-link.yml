name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1638]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45315494245 -R "$GITHUB_REPOSITORY" -n askodox-android-638 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1638.aab
          sha256sum askodox-play-1638.aab
          gh release create play-bundle-1638 askodox-play-1638.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1638" --notes "Play Console upload only (not installable on a phone). main 7defb3e: #421 #423 #424 #425 #426 #428 (paid notifications, counter orders + UPI QR + due, chepu button + guide ladder, menu tabs, business kit, Gemini picture fallback)."
