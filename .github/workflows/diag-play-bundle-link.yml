name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1694]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45561060682 -R "$GITHUB_REPOSITORY" -n askodox-android-694 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1694.aab
          sha256sum askodox-play-1694.aab
          gh release create play-bundle-1694 askodox-play-1694.aab -R "$GITHUB_REPOSITORY" --prerelease --target 873feb8523906e8dcedab2d8e39a3acbdcb09324 \
            --title "Play bundle 1694" --notes "Play Console upload only (not installable on a phone). 3-step pages batches 15-38 + #480-#484 (Money row message, baaki auto WhatsApp, shop link phase 2, guide tours, ask-net) on main 873feb8."
