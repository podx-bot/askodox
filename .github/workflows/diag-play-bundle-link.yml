name: diag play bundle link (throwaway, never merge)
on:
  push:
    branches: [diag/play-bundle-link-1608]
permissions:
  contents: write
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the Play bundle as a prerelease download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh run download 45103902773 -R "$GITHUB_REPOSITORY" -n askodox-android-608 -D out
          aab=$(find out -name '*.aab' | head -1)
          test -n "$aab"
          cp "$aab" askodox-play-1608.aab
          sha256sum askodox-play-1608.aab
          gh release create play-bundle-1608 askodox-play-1608.aab -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Play bundle 1608" --notes "Play Console upload only (not installable on a phone). Shop link orders go into the shop's app, WhatsApp = backup, WhatsApp box prefilled (#395)."
