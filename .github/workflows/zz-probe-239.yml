name: zz probe 239
on:
  push:
    branches: [zz-probe-239]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://admin.askodox.com
          curl -s $B/health/integrations > i.json
          python3 - <<'PY'
          import json
          d=json.load(open('i.json'))
          rows=d.get('integrations') or d.get('rows') or d
          def walk(x):
              if isinstance(x,dict):
                  if 'razorpay' in json.dumps(x).lower() and any(k in x for k in ('provider','id','name','key')) and len(json.dumps(x))<3000:
                      print('::warning::'+json.dumps(x)[:2500]); return
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          PY
          echo "::warning::fake signature -> $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -H 'X-Razorpay-Signature: deadbeef' -d '{"event":"payment.captured"}' $B/api/payments/webhook/razorpay)"
          echo "::warning::health $(curl -s $B/health)"
