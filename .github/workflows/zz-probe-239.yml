name: zz probe 239
on:
  push:
    branches: [zz-probe-239]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://admin.askodox.com
          for i in $(seq 1 40); do c=$(curl -s $B/health | jq -r .commit); [ "${c:0:7}" = "d3d4df4" ] && break; sleep 30; done
          echo "::warning::health commit=$c"
          echo "::warning::costs no-auth=$(curl -s -o /dev/null -w '%{http_code}' $B/admin/cc/ai-credits/costs)"
          echo "::warning::console=$(curl -s -o /dev/null -w '%{http_code}' $B/admin/console)"
          echo "::warning::razorpay $(curl -s $B/health/integrations | python3 -c "import json,sys;print([r.get('state')+' '+r.get('key_check','') for r in json.load(sys.stdin)['items'] if 'azorpay' in json.dumps(r)])")"
