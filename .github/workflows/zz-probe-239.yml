name: zz probe 239
on:
  push:
    branches: [zz-probe-239]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://admin.askodox.com
          curl -s $B/health/integrations > i.json
          python3 -c "
          import json
          for r in json.load(open('i.json'))['items']:
              t=json.dumps(r)
              if 'razorpay' in t.lower(): print('::warning::'+t[:3000])
          "
          echo "::warning::fake signature -> $(curl -s -w ' %{http_code}' -X POST -H 'Content-Type: application/json' -H 'X-Razorpay-Signature: deadbeef' -d '{"event":"payment.captured"}' $B/api/payments/webhook/razorpay)"
          echo "::warning::health $(curl -s $B/health)"
