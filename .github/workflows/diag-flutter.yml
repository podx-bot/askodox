name: diag flutter (throwaway)
on:
  push:
    branches: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: analyze
        run: |
          flutter analyze > an.txt 2>&1 || true
          python3 - <<'PY'
          lines = [l.strip() for l in open("an.txt") if " • " in l]
          for k in range(0, min(len(lines), 80), 8):
              print("::warning::AN " + " || ".join(lines[k:k+8]).replace("%", "%25"))
          print("::warning::ANCOUNT %d" % len(lines))
          PY
