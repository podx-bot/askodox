name: diag flutter (throwaway)
on:
  push:
    branches: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: analyze
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > an.txt 2>&1 || true
          grep -E "(info|warning|error) •" an.txt | head -40 | while IFS= read -r l; do echo "::warning::AN $l"; done
      - name: tests
        run: |
          flutter test --reporter expanded > t.txt 2>&1 || true
          grep -nE "\[E\]|Expected:|Actual:|Which:|EXCEPTION|The following|test/features/.*\.dart [0-9]+:[0-9]+" t.txt | head -60 | while IFS= read -r l; do echo "::warning::T $l"; done
          tail -3 t.txt | while IFS= read -r l; do echo "::warning::TAIL $l"; done
