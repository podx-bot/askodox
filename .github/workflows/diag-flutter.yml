name: diag flutter (throwaway)
on:
  push:
    branches: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: analyze
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > an.txt 2>&1 || true
          grep -E "(info|warning|error) •" an.txt | head -40 | while IFS= read -r l; do echo "::warning::AN $l"; done
      - name: tests
        run: |
          flutter test test/features/pos test/features/business test/features/guide test/features/home/history_explore_profile_test.dart test/features/profile > t.txt 2>&1 || true
          python3 - <<'PY'
          import re
          t = open("t.txt").read().split("\n")
          blocks = []
          for i, l in enumerate(t):
              if "EXCEPTION CAUGHT" in l or "[E]" in l:
                  blocks.append(" | ".join(x.strip() for x in t[i:i+28] if x.strip())[:1800])
          for b in blocks[:9]:
              print("::warning::" + b.replace("%", "%25"))
          print("::warning::TAIL " + " | ".join(t[-4:]))
          PY
