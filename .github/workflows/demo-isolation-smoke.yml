name: ASKODOX demo isolation smoke

on:
  push:
    branches:
      - main
    paths:
      - backend/app/repositories/universal_demand_repository.py
      - backend/app/services/universal_matcher.py
      - backend/app/services/demo_seed_service.py
      - backend/app/api/routes/universal_deals.py
      - .github/workflows/demo-isolation-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/app/repositories/universal_demand_repository.py
      - backend/app/services/universal_matcher.py
      - backend/app/services/demo_seed_service.py
      - backend/app/api/routes/universal_deals.py
      - .github/workflows/demo-isolation-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install demo route test dependencies
        run: python -m pip install --disable-pip-version-check fastapi imageio-ffmpeg

      - name: Verify REAL and TEST matching isolation
        run: |
          python - <<'PY'
          import tempfile

          from backend.app.repositories.universal_demand_repository import UniversalDemandRepository
          from backend.app.services.universal_matcher import UniversalMatcher

          with tempfile.NamedTemporaryFile(suffix='.db') as tmp:
              repo = UniversalDemandRepository(tmp.name)
              matcher = UniversalMatcher(repo)

              real_need_id = repo.create({
                  'user_id': 'app-real-seeker',
                  'side': 'NEED',
                  'domain': 'PRODUCT',
                  'subject': 'chicken',
                  'source': 'text',
              })
              real_offer_id = repo.create({
                  'user_id': 'app-real-seller',
                  'side': 'OFFER',
                  'domain': 'PRODUCT',
                  'subject': 'chicken',
                  'source': 'text',
              })
              demo_need_id = repo.create({
                  'user_id': 'app-demo-seeker',
                  'side': 'NEED',
                  'domain': 'PRODUCT',
                  'subject': 'chicken',
                  'source': 'demo:buyer',
              })
              demo_offer_id = repo.create({
                  'user_id': 'app-demo-seller',
                  'side': 'OFFER',
                  'domain': 'PRODUCT',
                  'subject': 'chicken',
                  'source': 'demo:seller',
              })

              real_matches = matcher.find_matches(repo.get(real_need_id))
              demo_matches = matcher.find_matches(repo.get(demo_need_id))

              real_ids = {row['id'] for row in real_matches}
              demo_ids = {row['id'] for row in demo_matches}

              assert real_offer_id in real_ids, real_matches
              assert demo_offer_id not in real_ids, real_matches
              assert demo_offer_id in demo_ids, demo_matches
              assert real_offer_id not in demo_ids, demo_matches

              assert {row['id'] for row in repo.list_active(test_mode=False)} == {real_need_id, real_offer_id}
              assert {row['id'] for row in repo.list_active(test_mode=True)} == {demo_need_id, demo_offer_id}

          print('REAL↔REAL and TEST↔TEST isolation passed')
          PY

      - name: Verify deterministic demo seed and reset
        run: |
          python - <<'PY'
          import tempfile

          from backend.app.repositories.universal_demand_repository import UniversalDemandRepository
          from backend.app.services.demo_seed_service import DemoSeedService
          from backend.app.services.universal_matcher import UniversalMatcher

          with tempfile.NamedTemporaryFile(suffix='.db') as tmp:
              repo = UniversalDemandRepository(tmp.name)
              matcher = UniversalMatcher(repo)
              seeds = DemoSeedService(repo)

              real_id = repo.create({
                  'user_id': 'app-real-preserved',
                  'side': 'NEED',
                  'domain': 'PRODUCT',
                  'subject': 'rice',
                  'source': 'text',
              })

              first = seeds.seed()
              assert first['created_count'] == 16, first
              assert len(first['pairs']) == 8, first
              assert len(seeds.active_demo_records()) == 16
              assert repo.get(real_id) is not None

              for flow, ids in first['pairs'].items():
                  party_a = repo.get(ids['party_a_id'])
                  party_b = repo.get(ids['party_b_id'])
                  matches = matcher.find_matches(party_a)
                  assert any(row['id'] == party_b['id'] for row in matches), (flow, matches)

              second = seeds.seed()
              assert second['deleted'] == 16, second
              assert second['created_count'] == 16, second
              assert len(second['pairs']) == 8, second
              assert len(seeds.active_demo_records()) == 16
              assert repo.get(real_id) is not None
              assert [row['id'] for row in repo.list_active(test_mode=False)] == [real_id]

              deleted = seeds.reset()
              assert deleted == 16, deleted
              assert seeds.active_demo_records() == []
              assert repo.get(real_id) is not None

          print('deterministic demo seed/reset passed')
          PY

      - name: Verify computer-operator demo job discovery result
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import tempfile
          from types import SimpleNamespace

          from app.api.routes.universal_deals import _demo_discovery_matches
          from app.repositories.universal_demand_repository import UniversalDemandRepository
          from app.services.demo_seed_service import DemoSeedService
          from app.services.universal_matcher import UniversalMatcher

          with tempfile.NamedTemporaryFile(suffix='.db') as tmp:
              repo = UniversalDemandRepository(tmp.name)
              matcher = UniversalMatcher(repo)
              seeded = DemoSeedService(repo).seed()
              job_ids = seeded['pairs']['job']
              seeker = repo.get(job_ids['party_a_id'])
              employer = repo.get(job_ids['party_b_id'])
              container = SimpleNamespace(
                  universal_demand_repository=repo,
                  universal_matcher=matcher,
              )

              results = _demo_discovery_matches(container, seeker, set())
              assert results, results
              job = next(row for row in results if row['match_id'] == employer['user_id'])
              assert job['demo'] is True, job
              assert job['match_source'] == 'demo_discovery', job
              assert 'Computer Operator' in job['title'], job
              assert job['subtitle'] == 'Demo employer available nearby', job

              real = repo.create({
                  'user_id': 'app-real-job-seeker',
                  'side': 'OFFER',
                  'domain': 'WORK',
                  'subject': 'computer operator',
                  'source': 'text',
              })
              assert _demo_discovery_matches(container, repo.get(real), set()) == []

          print('computer-operator demo discovery passed')
          PY
