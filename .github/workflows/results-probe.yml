name: Results probe

# Sends real /deals/discover requests (the exact call the Android app makes
# for chat result cards) to production and staging, and reports per stage
# what came back: matches, sources/segments, links, provider status.
on:
  push:
    branches-ignore: [main]
    paths: ['.github/results-probe.json', '.github/workflows/results-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          q = json.load(open('.github/results-probe.json'))['queries']
          bases = {'production': 'https://podx-ai-connect-production-3279.up.railway.app',
                   'staging': 'https://staging.askodox.com'}
          coords = {'Vijayawada': (16.5062, 80.6480)}
          # askodox.com/chat is proxied to the production backend (same engine).
          for url in ('https://askodox.com/chat', 'https://askodox.com/'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'ASKODOX-probe'}), timeout=60) as r:
                      body = r.read().decode('utf-8', 'replace')
                      print(f"WEBSITE {url} -> {r.status}", 'chat page (uses /deals/discover)' if '/deals/discover' in body else ('links /chat' if 'href="/chat"' in body else 'no chat'))
              except urllib.error.HTTPError as e:
                  print(f"WEBSITE {url} -> HTTP {e.code}")
              except Exception as e:
                  print(f"WEBSITE {url} -> {e}")
          try:
              with urllib.request.urlopen(urllib.request.Request(bases['production'] + '/health/maps', headers={'User-Agent': 'ASKODOX-probe'}), timeout=90) as r:
                  print('MAPS_HEALTH:', r.read().decode()[:900])
          except Exception as e:
              print('MAPS_HEALTH:', e)
          for path in ('/staff', '/api/early-access?install_id=probe', '/health/maps', '/api/content?limit=3', '/content',
                       '/api/discover/junction?latitude=16.4995&longitude=80.6560',
                       '/health/integrations', '/api/discover/resolve?q=Benz%20Circle%20Vijayawada&junction=true',
                       '/api/delivery/services', '/api/videos/feed?limit=3', '/api/delivery/jobs/mine',
                       '/admin/cc/mobility/overview', '/api/delivery/partners/me',
                       '/api/taxonomy/resolve?q=can%20you%20deliver%20food',
                       '/api/taxonomy/resolve?q=I%20can%20work%20as%20a%20delivery%20partner',
                       '/api/videos/ai-settings', '/api/videos/mine/inbox', '/api/me/notification-settings'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(bases['production'] + path, headers={'User-Agent': 'ASKODOX-probe'}), timeout=90) as r:
                      body = r.read().decode('utf-8', 'replace')
                      print(f"NEW {path} -> {r.status}", 'staff page' if 'Staff sign-in' in body else ('content page' if 'Updates &amp; news' in body else body[:900]))
              except urllib.error.HTTPError as e:
                  print(f"NEW {path} -> HTTP {e.code}")
          try:
              with urllib.request.urlopen(urllib.request.Request(bases['production'] + '/readiness', headers={'User-Agent': 'ASKODOX-probe'}), timeout=90) as r:
                  print('SECRETS_ENCRYPTION:', json.dumps(json.loads(r.read().decode()).get('secrets_encryption')))
          except Exception as e:
              print('SECRETS_ENCRYPTION:', e)
          for path in ('/admin/cc/workspace/me', '/api/staff/me', '/admin/cc/early-access/dashboard', '/admin/cc/workspace/analytics',
                       '/admin/cc/results/diagnostics', '/admin/cc/videos/comments', '/admin/cc/videos/analytics',
                       '/api/business/command-center', '/admin/cc/demand/supply-gaps', '/admin/cc/staff/work-queue'):
              try:
                  urllib.request.urlopen(urllib.request.Request(bases['production'] + path, headers={'User-Agent': 'ASKODOX-probe'}), timeout=60)
                  print(f"GUARD {path} -> 200 (unexpected)")
              except urllib.error.HTTPError as e:
                  print(f"GUARD {path} -> HTTP {e.code}")
          for path in ('/webhooks/meta-messaging?hub.mode=subscribe&hub.verify_token=x&hub.challenge=1', '/admin/cc/social-dm', '/admin/cc/marketplace-apis'):
              try:
                  urllib.request.urlopen(urllib.request.Request(bases['production'] + path, headers={'User-Agent': 'ASKODOX-probe'}), timeout=60)
                  print(f"GUARD {path.split('?')[0]} -> 200 (unexpected)")
              except urllib.error.HTTPError as e:
                  print(f"GUARD {path.split('?')[0]} -> HTTP {e.code}")
          for env, base in bases.items():
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + '/health/search', headers={'User-Agent': 'ASKODOX-probe'}), timeout=60) as r:
                      print(f"SEARCH_HEALTH[{env}] before:", r.read().decode()[:400])
              except Exception as e:
                  print(f"SEARCH_HEALTH[{env}] before: {e}")
              for path in ('/chat', '/api/flags?category=footwear&platform=android'):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base + path, headers={'User-Agent': 'ASKODOX-probe'}), timeout=60) as r:
                          body = r.read().decode('utf-8', 'replace')
                          print(f"PAGE[{env}] {path} -> {r.status}", body[:160].replace(chr(10), ' ') if path.startswith('/api') else ('uses /deals/discover' if '/deals/discover' in body else 'missing api'))
                  except urllib.error.HTTPError as e:
                      print(f"PAGE[{env}] {path} -> HTTP {e.code}")
              for path in ('/api/me/inbox', '/api/opportunities'):
                  try:
                      urllib.request.urlopen(urllib.request.Request(base + path, headers={'User-Agent': 'ASKODOX-probe'}), timeout=60)
                      print(f"AUTH[{env}] {path} -> 200 (unexpected without sign-in)")
                  except urllib.error.HTTPError as e:
                      print(f"AUTH[{env}] {path} -> HTTP {e.code}")
              for text, lang in (('car phone holder', 'en'), ('phone holder for car', 'en'), ('car', 'en'), ('కారు ఫోన్ హోల్డర్', 'te'), ('dentist', 'en'), ('doctor', 'te'), ('hotel in goa', 'en'), ('2 bhk flat for rent', 'en'), ('shoes for standing all day', 'en'), ('రన్నింగ్ షూస్ కావాలి', 'te'), ('need a personal loan', 'en')):
                  areq = urllib.request.Request(base + '/api/advisor/next', data=json.dumps({'raw_text': text, 'language': lang}).encode(),
                                                headers={'Content-Type': 'application/json', 'User-Agent': 'ASKODOX-probe'}, method='POST')
                  try:
                      with urllib.request.urlopen(areq, timeout=60) as r:
                          a = json.loads(r.read()); print(f"ADVISOR_NEXT[{env}] {text!r} ->", json.dumps({'category': (a.get('category') or {}).get('key'), 'matched_by': (a.get('category') or {}).get('matched_by'), 'ready': a.get('ready'), 'q': [x.get('question') for x in a.get('questions') or []], 'guidance': [(g.get('title'), g.get('high_stakes')) for g in a.get('guidance') or []]}, ensure_ascii=False))
                  except urllib.error.HTTPError as e:
                      print(f"ADVISOR_NEXT[{env}] {text!r} -> HTTP {e.code}")
              for item in q:
                  lat, lon = coords.get(item['place'], (None, None))
                  body = {'user_id': 'guest', 'raw_text': item['raw_text'], 'intent': item['intent'],
                          'subject': item['subject'], 'category': item['category'],
                          'location': {'label': item['place'], 'latitude': lat, 'longitude': lon, 'radius_km': 10},
                          'party_a': {'side': 'demand'}, 'party_b': {'side': 'supply'}}
                  # The app's exact payload: its rewritten raw_text + the user's own words in trace.
                  for extra in ('trace', 'dynamic_fields', 'size'):
                      if item.get(extra): body[extra] = item[extra]
                  req = urllib.request.Request(base + '/deals/discover', data=json.dumps(body).encode(),
                                               headers={'Content-Type': 'application/json',
                                                        'User-Agent': 'ASKODOX-probe'}, method='POST')
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          code, data = r.status, json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      code, data = e.code, {'error': e.read()[:300].decode('utf8', 'replace')}
                  except Exception as e:
                      code, data = 0, {'error': repr(e)}
                  m = data.get('matches') or []
                  for loc in ('te', 'en'):
                      dreq = urllib.request.Request(base + '/api/in-app/assistant', data=json.dumps(
                          {'message': (item.get('trace') or {}).get('query') or item['raw_text'], 'locale': loc, 'history': [], 'location': item['place']}).encode(),
                          headers={'Content-Type': 'application/json', 'User-Agent': 'ASKODOX-probe'}, method='POST')
                      try:
                          with urllib.request.urlopen(dreq, timeout=60) as r:
                              d = json.loads(r.read()); dcode = r.status
                      except urllib.error.HTTPError as e:
                          d, dcode = {'error': e.read()[:200].decode('utf8', 'replace')}, e.code
                      except Exception as e:
                          d, dcode = {'error': repr(e)}, 0
                      print(f"DECIDE[{loc}] HTTP {dcode} source={d.get('source')} transactional={d.get('transactional')} "
                            f"domain={d.get('domain')} action={d.get('action')} conf={d.get('confidence')} "
                            f"entities={json.dumps(d.get('entities'), ensure_ascii=False)[:200]} reply={str(d.get('reply'))[:120]!r} err={d.get('error')}")
                  links = [x for x in m if (x.get('destination_url') or x.get('normal_url') or '').startswith('http')]
                  print(f"\n=== {env} | {item['raw_text']} | HTTP {code}")
                  if 'error' in data: print('error:', data['error'])
                  print('matches:', len(m), '| with link:', len(links), '| segments:', data.get('segments'))
                  print('by source:', json.dumps({s: sum(1 for x in m if (x.get('match_source') or x.get('source')) == s)
                                                  for s in sorted({str(x.get('match_source') or x.get('source')) for x in m})}))
                  print('source_status:', json.dumps(data.get('source_status'), ensure_ascii=False)[:900])
                  print('CONTRACT:', json.dumps({'v': data.get('result_contract_version'),
                        'sections': [(s.get('kind'), s.get('count'), s.get('requested'), s.get('empty_reason')) for s in data.get('sections') or []],
                        'answer': data.get('answer'),
                        'constraints': (data.get('conversation_state') or {}).get('explicit_constraints')}, ensure_ascii=False)[:1200])
                  from urllib.parse import urlparse
                  hosts = {}
                  for x in m:
                      h = urlparse(x.get('destination_url') or '').netloc.replace('www.', '')
                      if h: hosts[h] = hosts.get(h, 0) + 1
                  print('DOMAINS:', json.dumps(hosts))
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base + '/health/search', headers={'User-Agent': 'ASKODOX-probe'}), timeout=60) as r:
                          print('SEARCH_HEALTH:', r.read().decode()[:400])
                  except Exception as e:
                      print('SEARCH_HEALTH:', e)
                  print('STALE_ROWS:', sum(1 for x in m if x.get('stale')))
                  print('MARKETPLACES:', {k: sum(v for h, v in hosts.items() if k in h) for k in ('amazon', 'flipkart', 'meesho')})
                  adv = data.get('advisor') or {}
                  print('ADVISOR:', json.dumps({'category': (adv.get('category') or {}).get('key'), 'ready': adv.get('ready'), 'questions': [(q.get('field'), q.get('required'), q.get('question')) for q in adv.get('questions') or []], 'guidance': [g.get('title') for g in adv.get('guidance') or []]}, ensure_ascii=False))
                  print('MARKETPLACE_INFO:', json.dumps(data.get('marketplaces'), ensure_ascii=False))
                  for x in m:
                      if x.get('marketplace') or x.get('origin') == 'affiliate_catalog':
                          print('  * MKT', x.get('marketplace'), '| routing', x.get('routing'), '| affiliate', x.get('affiliate'),
                                '|', str(x.get('title'))[:70], '|', str(x.get('destination_url'))[:100],
                                '| price', x.get('price'), x.get('price_source'))
                  print('RAWJSON', json.dumps(data, ensure_ascii=False)[:20000]) if os.environ.get('RAW') else None
                  for x in m[:10]:
                      print('  -', x.get('segment'), '|', (x.get('match_source') or x.get('source')), '|',
                            str(x.get('title'))[:60], '|', str(x.get('destination_url'))[:90], '| img' if x.get('image_url') else '')
          PY
