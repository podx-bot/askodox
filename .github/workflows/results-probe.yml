name: Results probe

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/results-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Health commit
        run: |
          B=https://podx-ai-connect-production-3279.up.railway.app
          for i in $(seq 1 20); do
            c=$(curl -sS -m 30 -A ASKODOX-probe $B/health | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit',''))" || true)
            echo "::warning::DEPLOYED_COMMIT=$c"
            case "$c" in 89b51eb*) break;; esac
            sleep 30
          done
