name: Results probe

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/results-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Health commit
        run: |
          for i in $(seq 1 20); do
            c=$(curl -sS -m 30 -A ASKODOX-probe https://podx-ai-connect-production-3279.up.railway.app/health | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit',''))" || true)
            echo "::warning::DEPLOYED_COMMIT=$c"
            case "$c" in 9c68fc3*) break;; esac
            sleep 30
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 -A ASKODOX-probe https://podx-ai-connect-production-3279.up.railway.app/staff)
          echo "::warning::STAFF_PAGE=$code"
          curl -sS -m 30 -A ASKODOX-probe https://podx-ai-connect-production-3279.up.railway.app/staff | grep -c "AskodoxPageReader" | xargs -I{} echo "::warning::STAFF_PAGE_READER_MENTIONS={}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 -X POST -H 'Content-Type: application/json' -d '{"url":"https://images.meesho.com/x.jpg"}' https://podx-ai-connect-production-3279.up.railway.app/admin/cc/workspace/uploads/from-url)
          echo "::warning::FROM_URL_ROUTE_UNAUTH=$code"
