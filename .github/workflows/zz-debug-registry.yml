name: zz debug registry
on:
  push:
    branches: [zz-debug-registry]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r backend/requirements.txt pytest
      - working-directory: backend
        shell: bash
        run: |
          files=$(python - <<'PY'
          import json
          reg = json.load(open('../docs/approved_features.json'))
          seen = []
          for f in reg['features']:
              if f.get('status') == 'deprecated':
                  continue
              for ref in (f.get('tests') or {}).get('backend') or []:
                  path = ref.split('::')[0]
                  if path not in seen:
                      seen.append(path)
          print(' '.join(seen))
          PY
          )
          python -m pytest -q -p no:warnings $files > out.txt 2>&1 || true
          grep -E "FAILED|^E |Error|passed|failed" out.txt | head -60 > f.txt || true
          python3 -c "
          t=open('f.txt').read()
          for i in range(0,min(len(t),30000),3000): print('::warning::'+t[i:i+3000].replace('%','%25').replace('\n','%0A'))"
