name: Firebase auth probe (read-only, temporary)
on:
  push:
    branches: [claude/firebase-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ vars.FIREBASE_API_KEY }}
      PID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Identity Toolkit (no SMS is sent; key never printed)
        run: |
          set -u
          echo "::notice title=project id::$PID"
          AND=(-H "X-Android-Package: com.askodox.askodox" -H "X-Android-Cert: 6337E11A34E755312077EF7D52B269AAA17B190A")
          r=$(curl -s "https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig?key=$KEY" "${AND[@]}")
          echo "::notice title=getProjectConfig (as the release app)::$(echo "$r" | jq -c '{projectId, error: .error.message, status: .error.status}')"
          r=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:sendVerificationCode?key=$KEY" "${AND[@]}" \
               -H 'Content-Type: application/json' --data '{"phoneNumber":"+15555550100"}')
          echo "::notice title=sendVerificationCode, fictional number, no app proof (as the release app)::$(echo "$r" | jq -c '{error: .error.message, status: .error.status, reason: [.error.details[]?.reason]}')"
          r=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:sendVerificationCode?key=$KEY" \
               -H 'Content-Type: application/json' --data '{"phoneNumber":"+15555550100"}')
          echo "::notice title=sendVerificationCode without Android identity::$(echo "$r" | jq -c '{error: .error.message, status: .error.status, reason: [.error.details[]?.reason]}')"
      - name: Production server Firebase verification
        run: |
          B=https://podx-ai-connect-production-3279.up.railway.app
          echo "::notice title=/onboarding/methods::$(curl -s $B/onboarding/methods)"
          echo "::notice title=firebase/verify forged::$(curl -s -o b.txt -w '%{http_code}' -X POST $B/onboarding/firebase/verify -H 'Content-Type: application/json' --data '{"id_token":"a.b.c"}') $(cat b.txt)"
