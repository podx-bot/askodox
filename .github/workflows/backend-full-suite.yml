name: Backend full test suite

# Brain foundation (2026-11-10 audit): no workflow ran the WHOLE backend suite; only subsets did.
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/approved_features.json'
      - '.github/workflows/backend-full-suite.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'

concurrency:
  group: backend-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Full suite
        working-directory: backend
        run: python -m pytest -q -p no:warnings tests
