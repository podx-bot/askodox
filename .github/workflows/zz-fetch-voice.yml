name: fetch nd voice
on:
  push:
    branches: [diag/fetch-nd-voice]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p samples
          curl -sSfL -o samples/nd.mp3 "https://elevenlabsusercontent.com/database/workspace/c249b5cf8027417abd6a3ad0f8615bc9/content_generation/1XsYzDF8Pg1iYT9XUimF/UjSxfsG16W6L8j0MIMvu/content.mp3?Expires=1795176000&KeyName=assets-cdn-key-1&Signature=NKclNk3rPK-PZtpkvm9aF15LtjA="
          ls -la samples
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add samples; git commit -m "nd voice"; git push
