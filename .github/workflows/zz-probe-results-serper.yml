name: Probe results with Serper (throwaway)
on:
  push:
    branches: [claude/probe-results-serper]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover in production
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base = 'https://admin.askodox.com'
          def post(path, data):
              req = urllib.request.Request(base + path, data=json.dumps(data).encode(),
                                           headers={'Content-Type': 'application/json', 'User-Agent': 'ASKODOX-probe'}, method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  return e.code, {'error': e.read()[:300].decode('utf-8', 'replace')}
          loc = {'label': 'Vijayawada', 'latitude': 16.5062, 'longitude': 80.6480}
          for subject, said in (('Oppo Find X10', 'Oppo Find X10 కావాలి'), ('washing machine', 'washing machine under 30000 show me'),
                                ('iPhone 17', 'iPhone 17 price')):
              body = {'user_id': '', 'raw_text': said, 'intent': 'buy', 'subject': subject, 'category': 'electronics',
                      'location': loc, 'dynamic_fields': {}, 'trace': {'query': said}}
              code, d = post('/deals/discover', body)
              secs = d.get('sections') or {}
              sizes = {k: len(v.get('items', v) if isinstance(v, dict) else v) for k, v in secs.items()} if isinstance(secs, dict) else secs
              status = d.get('source_status') or d.get('sources') or {}
              m = d.get('matches') or []
              first = [(x.get('source') or x.get('segment'), (x.get('title') or '')[:50], (x.get('url') or x.get('link') or '')[:60]) for x in m[:6]]
              print(f'::notice title={subject}::status {code} | matches {len(m)} | sections {json.dumps(sizes)[:600]} | sources {json.dumps(status, ensure_ascii=False)[:900]} | first {first} | err {str(d.get("error",""))[:200]}')
          PY
