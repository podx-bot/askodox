name: Probe results with Serper (throwaway)
on:
  push:
    branches: [claude/probe-results-serper]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: After 255-257 deploy
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          base = 'https://admin.askodox.com'
          def call(path, data=None):
              req = urllib.request.Request(base + path, data=json.dumps(data).encode() if data else None,
                                           headers={'Content-Type': 'application/json', 'User-Agent': 'ASKODOX-probe'},
                                           method='POST' if data else 'GET')
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  return e.code, {}
          live = ''
          for _ in range(60):
              _, h = call('/health')
              live = str(h.get('commit', ''))
              if live.startswith('f742fb3'):
                  break
              time.sleep(30)
          print(f'::notice title=deployed::{live}')
          loc = {'label': 'Vijayawada', 'latitude': 16.5062, 'longitude': 80.6480}
          for subject, said in (('Oppo Find X10 Pro Max', 'Oppo Find X10 Pro Max కావాలి'), ('washing machine', 'washing machine under 30000 show me')):
              code, d = call('/deals/discover', {'user_id': '', 'raw_text': said, 'intent': 'buy', 'subject': subject,
                                                 'category': 'electronics', 'location': loc, 'dynamic_fields': {},
                                                 'trace': {'query': said}})
              stat = {sec.get('kind'): sec.get('status') for sec in (d.get('sections') or []) if isinstance(sec, dict)}
              mk = [ (m.get('marketplace') or m.get('source'), (m.get('title') or '')[:40]) for m in (d.get('matches') or []) if m.get('marketplace')]
              print(f'::notice title={subject}::matches {len(d.get("matches") or [])} | status {json.dumps(stat, ensure_ascii=False)[:700]} | marketplace rows {mk[:6]}')
          _, hs = call('/health/search')
          print('::notice title=search health::' + json.dumps(hs, ensure_ascii=False)[:1200])
          code, d = call('/api/in-app/assistant', {'message': 'ఒప్పో ఫైండ్ ఎక్స్ 10 గురించి చెప్పండి', 'locale': 'te', 'history': []})
          g = d.get('grounding') or {}
          print(f'::notice title=telugu script phone::status {code} | mode {g.get("mode")} | verified {g.get("verified")} | honesty {d.get("honesty")} | sources {len(g.get("sources") or [])} | reply: {(d.get("reply") or "")[:400]}'.replace('\n', ' '))
          PY
