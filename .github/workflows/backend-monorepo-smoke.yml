name: ASKODOX backend monorepo smoke

on:
  push:
    branches:
      - main
      - migration/backend-monorepo
    paths:
      - Dockerfile
      - .dockerignore
      - railway.json
      - backend/**
      - .github/workflows/backend-monorepo-smoke.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - railway.json
      - backend/**
      - .github/workflows/backend-monorepo-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify provider reliability primitive
        run: |
          python - <<'PY'
          from time import sleep

          from backend.app.core.provider_reliability import (
              ProviderPolicy,
              ProviderReliabilityExecutor,
          )

          executor = ProviderReliabilityExecutor(
              ProviderPolicy(timeout_seconds=0.05, failure_threshold=2, cooldown_seconds=60)
          )

          def fail():
              raise RuntimeError("primary unavailable")

          assert executor.execute([("primary", fail), ("fallback", lambda: "ok")]) == "ok"
          assert not executor.circuit_open("primary")

          assert executor.execute([("primary", fail), ("fallback", lambda: "ok")]) == "ok"
          assert executor.circuit_open("primary")
          assert executor.execute([("primary", lambda: "wrong"), ("fallback", lambda: "circuit-skip")]) == "circuit-skip"

          def slow():
              sleep(0.2)
              return "too-late"

          assert executor.execute([("slow", slow), ("fast", lambda: "timeout-fallback")]) == "timeout-fallback"
          print("provider reliability smoke passed")
          PY

      - name: Verify patch-safe domain isolation
        run: |
          python - <<'PY'
          from backend.app.core.domain_module_registry import DomainModuleRegistry

          registry = DomainModuleRegistry()
          registry.register("chicken", lambda payload: f"chicken:{payload['value']}")
          registry.register("ride", lambda payload: f"ride:{payload['value']}")
          registry.register("jobs", lambda payload: f"jobs:{payload['value']}")

          assert registry.execute("chicken", {"value": "v1"}) == "chicken:v1"
          assert registry.execute("ride", {"value": "v1"}) == "ride:v1"
          assert registry.execute("jobs", {"value": "v1"}) == "jobs:v1"

          registry.register(
              "chicken",
              lambda payload: f"chicken-patched:{payload['value']}",
              replace=True,
          )

          assert registry.execute("chicken", {"value": "v2"}) == "chicken-patched:v2"
          assert registry.execute("ride", {"value": "v2"}) == "ride:v2"
          assert registry.execute("jobs", {"value": "v2"}) == "jobs:v2"
          assert registry.snapshot() == {
              "chicken": ("default",),
              "jobs": ("default",),
              "ride": ("default",),
          }
          print("patch-safe domain isolation smoke passed")
          PY

      - name: Verify real-user intent routing
        run: |
          python - <<'PY'
          from backend.app.core.domain_module_registry import DomainModuleRegistry
          from backend.app.core.intent_domain_router import IntentRule, RealUserIntentRouter

          router = RealUserIntentRouter()
          router.register_many([
              IntentRule(
                  domain="ride",
                  phrases=("need a cab", "need a ride"),
                  keywords=("cab", "ride", "taxi"),
              ),
              IntentRule(
                  domain="service",
                  phrases=("near me",),
                  keywords=("electrician", "plumber", "repair"),
              ),
              IntentRule(
                  domain="jobs",
                  phrases=("looking for job", "job opening"),
                  keywords=("job", "vacancy", "hiring"),
              ),
          ])

          assert router.route("Need a cab from Vijayawada to Gannavaram today").domain == "ride"
          assert router.route("Looking for electrician near me").domain == "service"
          assert router.route("I am looking for job in accounts").domain == "jobs"

          registry = DomainModuleRegistry()
          registry.register("ride", lambda payload: f"ride:{payload['id']}")
          registry.register("service", lambda payload: f"service:{payload['id']}")
          registry.register("jobs", lambda payload: f"jobs:{payload['id']}")

          assert router.dispatch("Taxi needed today", {"id": 7}, registry) == "ride:7"
          assert router.dispatch("Plumber near me", {"id": 8}, registry) == "service:8"
          assert router.dispatch("Any job vacancy?", {"id": 9}, registry) == "jobs:9"
          print("real-user intent routing smoke passed")
          PY

      - name: Verify baseline intent families
        run: |
          python - <<'PY'
          from backend.app.core.default_intent_rules import build_default_intent_router

          router = build_default_intent_router()

          cases = {
              "I want to buy a used laptop": ("commerce", "buy"),
              "I want to sell my old phone": ("commerce", "sell"),
              "Need a house for rent near me": ("rental", "rent"),
              "Book appointment with a doctor": ("appointment", "book"),
              "I need to send parcel to Hyderabad": ("parcel", "send"),
              "How do I file a complaint about this service?": ("assistance", "complaint"),
              "How to apply for this scheme?": ("assistance", "application"),
              "I have a doubt, can you explain this?": ("assistance", "doubt"),
              "నాకు ఒక వస్తువు కొనాలి": ("commerce", "buy"),
              "కంప్లైంట్ చేయాలి": ("assistance", "complaint"),
              "ఎలా అప్లై చేయాలి": ("assistance", "application"),
          }

          for text, expected in cases.items():
              route = router.route(text)
              assert (route.domain, route.action) == expected, (text, route, expected)

          print("baseline intent families smoke passed")
          PY

      - name: Build backend image from monorepo
        run: docker build -t askodox-backend-smoke .

      - name: Start backend container
        run: |
          docker run -d --name askodox-backend \
            -e PORT=8000 \
            -e PODX_DATABASE_PATH=/tmp/askodox-smoke.db \
            -p 8000:8000 \
            askodox-backend-smoke

      - name: Wait for health endpoint
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs askodox-backend
          exit 1

      - name: Verify observability headers
        run: |
          set -euxo pipefail
          request_id="askodox-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS \
            -H "X-Request-ID: ${request_id}" \
            -D /tmp/askodox-headers.txt \
            -o /tmp/askodox-health.json \
            http://127.0.0.1:8000/health
          tr -d '\r' < /tmp/askodox-headers.txt > /tmp/askodox-headers-normalized.txt
          grep -Fxi "x-request-id: ${request_id}" /tmp/askodox-headers-normalized.txt
          grep -Eqi '^server-timing: app;dur=[0-9]+(\.[0-9]+)?$' /tmp/askodox-headers-normalized.txt

      - name: Show container logs
        if: always()
        run: docker logs askodox-backend || true
