name: active-deal-context-smoke

on:
  push:
    paths:
      - 'backend/app/services/active_deal_context_resolver.py'
      - 'backend/app/services/universal_live_capture_service.py'
      - 'backend/tests/test_active_deal_context_resolver.py'
      - 'backend/tests/test_universal_live_capture_active_merge.py'
      - '.github/workflows/active-deal-context-smoke.yml'
  pull_request:
    paths:
      - 'backend/app/services/active_deal_context_resolver.py'
      - 'backend/app/services/universal_live_capture_service.py'
      - 'backend/tests/test_active_deal_context_resolver.py'
      - 'backend/tests/test_universal_live_capture_active_merge.py'
      - '.github/workflows/active-deal-context-smoke.yml'
  workflow_dispatch:

jobs:
  resolver-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify active deal resolver and live-capture merge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pytest
          PYTHONPATH=backend python3 -m pytest -q \
            backend/tests/test_active_deal_context_resolver.py \
            backend/tests/test_universal_live_capture_active_merge.py
