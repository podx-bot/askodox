name: in-app-e2e-smoke

on:
  push:
    paths:
      - 'backend/app/api/app_factory.py'
      - 'backend/app/api/routes/universal_deals.py'
      - 'backend/app/api/routes/in_app_deal.py'
      - 'backend/app/services/session_tokens.py'
      - 'backend/app/services/universal_live_capture_service.py'
      - 'backend/app/services/conversation_os_runtime_service.py'
      - 'backend/app/services/customer_facing_response_policy.py'
      - 'backend/app/services/universal_ai_assistant_service.py'
      - 'backend/app/services/user_memory_service.py'
      - '.github/workflows/in-app-e2e-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Verify real ASKODOX in-app HTTP conversation path
        env:
          DATABASE_PATH: /tmp/askodox-in-app-e2e.db
          GEMINI_API_KEY: ''
          BRAVE_SEARCH_API_KEY: ''
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from server import app, container
          from app.services.session_tokens import issue_token

          # 2026-09-17 (round 15): this test used to call /debug/message and
          # /debug/inbox/{user_id} -- two endpoints that took a client-supplied
          # identity with zero proof (the exact spoofing gap the rest of the
          # backend was already fixed against). Round 15 deletes those 4 unused
          # handlers instead of authenticating them, since a repo-wide search
          # found zero real callers -- but this CI test was, unexpectedly, the
          # one real "caller" left. So this test now exercises the actual
          # production path instead: POST /deals and GET /deals/{id}/matches
          # (see universal_deals.py), the same real endpoints the ASKODOX app
          # itself uses to publish a requirement and see interested matches,
          # including the real bearer-token authentication those endpoints
          # require.
          #
          # Fixed post-review: /deals (universal_deals_router) is mounted only
          # in server.py, not in app.api.app_factory.create_app() alone -- the
          # first version of this test imported create_app() directly and got
          # a 404 on every /deals call, confirmed both locally and in a real
          # CI run. server.py is what actually runs in production (see the
          # Dockerfile CMD), so importing its already-built app/container here
          # is what makes this test exercise the real, fully-wired app instead
          # of a partial one.

          # /deals classifies the raw message with container.universal_request_extractor,
          # which calls the real Gemini API -- unavailable in CI (GEMINI_API_KEY is
          # intentionally blank above, same as before this round). Standing in for
          # just this one method keeps every other line of the real request --
          # authentication, live-capture persistence, the HTTP response contract --
          # on the genuine code path, the same way the previous version of this test
          # never depended on real WhatsApp/Gemini delivery either.
          def _fake_extract(message):
              return {
                  'success': True,
                  'status': 'EXTRACTED',
                  'request': {
                      'side': 'NEED',
                      'domain': 'PRODUCT',
                      'subject': 'rice',
                      'quantity': 2.0,
                      'unit': 'kg',
                      'price': None,
                      'currency': None,
                      'when_text': None,
                      'location_text': 'Vijayawada',
                      'location_required': True,
                      'constraints': [],
                      'confidence': 0.9,
                      'source_text': message,
                  },
              }

          container.universal_request_extractor.extract = _fake_extract

          owner = 'app-e2e-point1'
          other = 'app-e2e-point2'
          owner_headers = {
              'Authorization': f"Bearer {issue_token(owner, container.settings.session_token_secret)}",
          }
          other_headers = {
              'Authorization': f"Bearer {issue_token(other, container.settings.session_token_secret)}",
          }

          with TestClient(app) as client:
              no_token = client.post('/deals', json={
                  'user_id': owner,
                  'raw_text': 'I need 2kg rice delivered to Vijayawada',
              })
              assert no_token.status_code == 401, no_token.text

              created = client.post(
                  '/deals',
                  json={
                      'user_id': owner,
                      'raw_text': 'I need 2kg rice delivered to Vijayawada',
                  },
                  headers=owner_headers,
              )
              assert created.status_code == 200, created.text
              body = created.json()
              deal_id = body['deal_id']
              assert deal_id
              assert isinstance(body.get('reply'), str) and body['reply'].strip(), body

              user = container.user_repository.find_by_whatsapp_mobile(owner)
              assert user is not None
              assert int(user.get('registration_complete') or 0) == 1

              rows = container.database.fetchall(
                  '''
                  SELECT channel,user_id,user_message,bot_message
                  FROM conversation_os_turns
                  WHERE user_id=?
                  ORDER BY id ASC
                  ''',
                  (owner,),
              )
              assert len(rows) >= 1, rows
              assert all(str(row['channel']) == 'in_app' for row in rows), rows
              assert str(rows[-1]['user_message']).strip()
              assert str(rows[-1]['bot_message']).strip()

              demand = container.universal_demand_repository.get(deal_id)
              assert demand is not None, 'the deal created via POST /deals was not persisted'
              assert str(demand.get('user_id')) == owner

              own_matches = client.get(f'/deals/{deal_id}/matches', headers=owner_headers)
              assert own_matches.status_code == 200, own_matches.text

              matches_no_token = client.get(f'/deals/{deal_id}/matches')
              assert matches_no_token.status_code == 401, matches_no_token.text

              # Round 15's other fix: before it, anyone who knew a deal_id could
              # see who was interested in it. A second, differently-authenticated
              # user must be refused.
              other_matches = client.get(f'/deals/{deal_id}/matches', headers=other_headers)
              assert other_matches.status_code == 403, other_matches.text

          print('ASKODOX real in-app E2E smoke passed')
          PY
