name: OTP autofill (SMS User Consent) emulator test

# Real Android SMS User Consent on an emulator with Google Play services: an
# OTP SMS is delivered to the emulator (adb emu sms send), Android shows its
# own consent prompt, the script taps Allow, and the app must receive exactly
# the 6-digit code. No SMS permission is involved.
on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/build.gradle.kts'
      - 'lib/core/auth/sms_code_listener.dart'
      - 'integration_test/sms_consent_test.dart'
      - '.github/workflows/sms-consent-e2e.yml'
  push:
    branches: [claude/sms-e2e-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sms-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          cat > sms-e2e.sh <<'SH'
          set -u
          flutter test integration_test/sms_consent_test.dart -d emulator-5554 > it.txt 2>&1 &
          TEST=$!
          for i in $(seq 1 120); do grep -q ASKODOX_SMS_CONSENT_LISTENING it.txt && break; sleep 5; done
          grep -q ASKODOX_SMS_CONSENT_LISTENING it.txt || { echo "::error::listener never started"; tail -30 it.txt | sed 's/^/::warning::/'; exit 1; }
          sleep 3
          adb shell dumpsys activity activities | grep -E "topResumedActivity" | head -1 | tr -s ' ' | sed 's/^/::notice title=before SMS::/'
          # The consent prompt is an activity started by the app: ASKODOX must be in front.
          adb shell dumpsys activity activities | grep -E "com.askodox|Task\{" | head -8 | tr -s ' ' | cut -c1-200 | sed 's/^/::notice title=tasks::/'
          adb shell pidof com.askodox.askodox | sed 's/^/::notice title=pid::/'
          adb shell am start -W -n com.askodox.askodox/.MainActivity 2>&1 | tr -s ' ' | head -6 | sed 's/^/::notice title=am start::/' || true
          sleep 3
          adb shell dumpsys activity activities | grep -E "topResumedActivity" | head -1 | tr -s ' ' | sed 's/^/::notice title=in front::/'
          adb logcat -c
          adb emu sms send 5551234 "482915 is your verification code for askodox-81252.firebaseapp.com."
          tapped=no
          for i in $(seq 1 40); do
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            node=$(adb shell cat /sdcard/ui.xml | tr '>' '\n' | grep -iE 'text="Allow"' | head -1)
            if [ -n "$node" ]; then
              b=$(echo "$node" | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | grep -oE '[0-9]+' | tr '\n' ' ')
              set -- $b
              adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
              echo "::notice title=consent prompt::Android's own prompt shown; tapped Allow"
              tapped=yes
              break
            fi
            sleep 3
          done
          adb shell content query --uri content://sms/inbox --projection address 2>/dev/null | head -3 | sed 's/^/::notice title=sms inbox::/'
          adb logcat -d | grep -iE "SmsRetriever|SmsUserConsent|SMS_RETRIEVED|consent|ActivityTaskManager: START" | head -15 | cut -c1-220 | sed 's/^/::notice title=logcat::/'
          adb shell dumpsys package com.google.android.gms | grep -m1 versionName | sed 's/^/::notice title=gms::/'
          [ "$tapped" = yes ] || adb shell cat /sdcard/ui.xml | grep -oE 'text="[^"]+"' | sort -u | head -20 | sed 's/^/::warning::screen /'
          wait $TEST; rc=$?
          grep -E "ASKODOX_SMS_CONSENT_EVENTS|All tests passed|Some tests failed|Expected|Actual" it.txt | head -10 | sed 's/^/::notice title=result::/'
          adb shell dumpsys package com.askodox.askodox | grep -E "android.permission.(READ|RECEIVE)_SMS" && { echo "::error::SMS permission present"; exit 1; } || echo "::notice title=permissions::no READ_SMS / RECEIVE_SMS"
          exit $rc
          SH
      - name: Emulator (Play services) - real SMS -> consent prompt -> code
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash sms-e2e.sh
