name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors are fatal; warnings/info remain visible)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
