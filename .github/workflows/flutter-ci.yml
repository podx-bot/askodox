name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors are fatal; warnings/info remain visible)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Generate Android runner for CI build
        run: flutter create --platforms=android --project-name podx .
      - name: Build installable Android APK
        run: flutter build apk --debug
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: podx-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
