name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: askodox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: write

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  askodox-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Use pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain and scripts first
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          bash -n tool/apply_home_robot_layout_fix.sh
          bash -n tool/apply_android_askodox_branding.sh
          bash -n tool/apply_android_live_device_bridge.sh
          test -f lib/main.dart
          test -f pubspec.yaml

      - name: Apply deterministic source preflight fixes
        run: bash tool/apply_home_robot_layout_fix.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android runner once for preflight
        run: flutter create --platforms=android --org com.askodox --project-name askodox .

      - name: Apply ASKODOX native bridges
        shell: bash
        run: |
          set -euo pipefail
          bash tool/apply_android_askodox_branding.sh
          bash tool/apply_android_live_device_bridge.sh

      - name: Verify ASKODOX native bridge before build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ASKODOX' android/app/src/main/res/values/strings.xml
          grep -q 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'com.askodox.app/update' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'com.askodox.app/device' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'startVoiceSearch' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          ./android/gradlew -p android tasks >/dev/null

      - name: Build ASKODOX debug APK as hard preflight gate
        run: |
          flutter build apk --debug \
            -t lib/main.dart \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_ENV=staging \
            --dart-define=BACKEND_PROVIDER=rest \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ASKODOX_ENABLE_UPDATES=true \
            --dart-define=ASKODOX_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Upload preflight APK
        uses: actions/upload-artifact@v4
        with:
          name: askodox-real-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  askodox-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: askodox-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Use same pinned Flutter as preflight
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply same deterministic source fixes
        run: bash tool/apply_home_robot_layout_fix.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Recreate deterministic Android runner
        run: flutter create --platforms=android --org com.askodox --project-name askodox .

      - name: Apply ASKODOX native bridges
        shell: bash
        run: |
          set -euo pipefail
          bash tool/apply_android_askodox_branding.sh
          bash tool/apply_android_live_device_bridge.sh

      - name: Configure stable release signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Stable signing secrets are not configured; release publish skipped.'
            exit 0
          fi
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64'].replace('\ufeff', '')
          raw = re.sub(r'-----BEGIN [^-]+-----', '', raw)
          raw = re.sub(r'-----END [^-]+-----', '', raw)
          payload = re.sub(r'[^A-Za-z0-9+/=]', '', raw).rstrip('=')
          payload += '=' * ((4 - len(payload) % 4) % 4)
          if not payload:
              raise SystemExit('Keystore Base64 payload is empty')
          data = base64.b64decode(payload, validate=True)
          if len(data) < 100:
              raise SystemExit('Decoded keystore is unexpectedly small')
          Path('android/app/askodox-release.jks').write_bytes(data)
          PY
          keytool -list -keystore android/app/askodox-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=askodox-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          s = s.replace('android {', 'val keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\n\nandroid {', 1)
          s = s.replace('    buildTypes {', '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {', 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Build stable signed ASKODOX update APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          flutter build apk --release \
            -t lib/main.dart \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_PROVIDER=rest \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ASKODOX_ENABLE_UPDATES=true \
            --dart-define=ASKODOX_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Publish ASKODOX latest in-app update
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer main commit exists; skipping stale APK publish.'
            exit 0
          fi
          cp build/app/outputs/flutter-apk/app-release.apk askodox-latest.apk
          cat > latest.json <<EOF
          {
            "version": "1.0.${GITHUB_RUN_NUMBER}",
            "build_number": ${GITHUB_RUN_NUMBER},
            "mandatory": false,
            "notes": "Latest ASKODOX update",
            "apk_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/askodox-latest/askodox-latest.apk"
          }
          EOF
          if ! gh release view askodox-latest >/dev/null 2>&1; then
            gh release create askodox-latest --prerelease --title "ASKODOX latest" --notes "ASKODOX in-app update channel"
          fi
          gh release upload askodox-latest askodox-latest.apk latest.json --clobber
