name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: askodox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: write

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  askodox-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify scripts and source tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n tool/apply_android_askodox_branding.sh
          bash -n tool/apply_android_live_device_bridge.sh
          test -f lib/main.dart
          test -f pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: |
          set +e
          flutter test --reporter json > /tmp/flutter-test.json
          code=$?
          python3 - <<'PY'
          import json
          names, errs = {}, {}
          for line in open('/tmp/flutter-test.json'):
              try: e = json.loads(line)
              except Exception: continue
              if e.get('type') == 'testStart': names[e['test']['id']] = e['test']['name']
              if e.get('type') == 'error': errs.setdefault(e['testID'], []).append(e.get('error', '')[:300])
              if e.get('type') == 'print': errs.setdefault(e['testID'], []).append(e['message'][:900])
          failed = {e2 for e2 in errs if any('Test failed' in m for m in errs[e2])}
          for tid, msgs in [(t, errs[t]) for t in failed][:10]:
              msg = (names.get(tid, '?') + ' :: ' + ' | '.join(msgs)).replace('\n', ' ').replace('%', '%25')
              print('::error title=FAILED TEST::' + msg[:1800])
          PY
          exit $code

  askodox-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: askodox-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Use same pinned Flutter as preflight
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Recreate deterministic Android runner
        run: flutter create --platforms=android --org com.askodox --project-name askodox .

      - name: Apply ASKODOX native bridges
        shell: bash
        run: |
          set -euo pipefail
          bash tool/apply_android_askodox_branding.sh
          bash tool/apply_android_live_device_bridge.sh

      - name: Verify ASKODOX native bridge before release build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ASKODOX' android/app/src/main/res/values/strings.xml
          grep -q 'android:label="@string/app_name"' android/app/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'com.askodox.app/update' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'com.askodox.app/device' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'startVoiceSearch' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'packageInstaller' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'SessionParams' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'openWrite' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'session.commit' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          # The committed bridge must survive the scripts (Geocoder naming,
          # notifications, lip-sync speech events).
          grep -q 'reverseGeocode' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'showNotification' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt
          grep -q 'speechRange' android/app/src/main/kotlin/com/askodox/askodox/MainActivity.kt

      - name: Require stable release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required release secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'ASKODOX release cannot publish without all signing secrets.' >&2
            exit 1
          fi

      - name: Configure stable release signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64'].replace('\ufeff', '')
          raw = re.sub(r'-----BEGIN [^-]+-----', '', raw)
          raw = re.sub(r'-----END [^-]+-----', '', raw)
          payload = re.sub(r'[^A-Za-z0-9+/=]', '', raw).rstrip('=')
          payload += '=' * ((4 - len(payload) % 4) % 4)
          if not payload:
              raise SystemExit('Keystore Base64 payload is empty')
          data = base64.b64decode(payload, validate=True)
          if len(data) < 100:
              raise SystemExit('Decoded keystore is unexpectedly small')
          Path('android/app/askodox-release.jks').write_bytes(data)
          PY
          keytool -list -keystore android/app/askodox-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=askodox-release.jks
          EOF
          # android/app/build.gradle.kts signs release builds with this key only.
          ! grep -q 'signingConfigs.getByName("debug")' android/app/build.gradle.kts

      - name: Build stable signed ASKODOX update APK
        run: |
          flutter build apk --release \
            -t lib/main.dart \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_PROVIDER=rest \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ASKODOX_ENABLE_UPDATES=true \
            --dart-define=ASKODOX_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          test -s build/app/outputs/flutter-apk/app-release.apk

      # Verification build only. The in-app update channel (askodox-latest)
      # has ONE publisher: Android Live Build, whose build numbers are always
      # above everything published. This job used its own run number
      # (~1017) and overwrote the channel below installed builds (1277+),
      # so Android rejected the "update" as a downgrade.
      - name: Guard signed APK (release key, package, production backend)
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(echo "$API_BASE_URL" | sed -E 's#^https://([^/]+).*#\1#')"
          python3 tool/apk_guard.py build/app/outputs/flutter-apk/app-release.apk \
            --cert "$(cat .github/askodox-release-cert.sha256)" --package com.askodox.askodox \
            --forbid-host staging.askodox.com --require-host "$HOST"
