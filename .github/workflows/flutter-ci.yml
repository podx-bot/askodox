name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze compile errors
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test

  askodox-app-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate Android runner for ASKODOX
        run: flutter create --platforms=android --org com.askodox --project-name askodox .
      - name: Build real ASKODOX app APK
        run: |
          flutter build apk --debug \
            -t lib/main.dart \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_ENV=staging \
            --dart-define=BACKEND_PROVIDER=rest \
            --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Upload ASKODOX Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: askodox-real-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
