name: ASKODOX OASAT domain reasoning smoke

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/services/oasat_domain_router.py'
      - 'backend/app/services/oasat_domain_reasoning_service.py'
      - 'backend/app/services/conversation_os_runtime_service.py'
      - '.github/workflows/oasat-domain-reasoning-smoke.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify universal domains, switching, and general fallback through ConversationOS
        working-directory: backend
        run: |
          python - <<'PY'
          from app.services.oasat_domain_router import OASATDomainRouter
          from app.services.oasat_domain_reasoning_service import OASATDomainReasoningService
          from app.services.conversation_os_runtime_service import ConversationOSRuntimeService

          router = OASATDomainRouter(); reasoning = OASATDomainReasoningService()
          expected = {
              'Explain this PDF': ('DOCUMENTS', 'document_goal', 'explain', 'seller_matching'),
              'I need a job': ('JOBS', 'skills', 'match_jobs', None),
              'Need doctor appointment': ('APPOINTMENTS', 'specialty_or_need', 'book_after_approval', None),
              'Need a plumber service': ('SERVICES', 'problem', 'match_service_provider', None),
              'Need a ride to airport': ('RIDES', 'pickup', 'match_ride', None),
              'Plan food for ten relatives': ('FOOD', 'people_or_quantity', 'suggest_food_plan', None),
              'Research the best solar options': ('RESEARCH', 'topic', 'research', 'seller_matching'),
              'Remind me tomorrow to pay bill': ('REMINDERS', 'task', 'schedule_after_approval', None),
              'I want to buy a laptop': ('COMMERCE', 'item', 'compare_offers', None),
              'Help me decide what to do next': ('GENERAL', 'goal', 'suggest_next_step', None),
          }

          class Delegate:
              def __init__(self): self.last = ''
              def process(self, sender_mobile, message): self.last = message; return 'ok'
          class Ledger:
              def __init__(self): self.state = None
              def load_state(self, user_id): return self.state
              def save_state(self, user_id, state, channel=None): self.state = state
              def append_turn(self, *args, **kwargs): pass

          for i, (message, contract) in enumerate(expected.items(), 1):
              domain, question, action, never_force = contract
              plan = router.route(message)
              built = reasoning.build(plan)
              assert plan['domain'] == domain, (message, plan)
              assert question in built['questions'], (message, built)
              assert action in built['allowed_actions'], (message, built)
              if never_force:
                  assert never_force in built['never_force'], (message, built)

              d=Delegate(); l=Ledger(); runtime=ConversationOSRuntimeService(d,l)
              assert runtime.process(f'u{i}', message) == 'ok'
              known=l.state['known_fields']
              assert known['domain'] == domain, (message, known)
              assert question in known['oasat_questions'], (message, known)
              assert action in known['oasat_allowed_actions'], (message, known)
              assert f'OASAT domain={domain}' in d.last, (message, d.last)
              assert action in d.last, (message, d.last)
              assert 'Do not force commerce/seller logic into non-commerce domains.' in d.last
              if domain not in {'COMMERCE','FOOD'}:
                  assert 'oasat_commerce_evidence' not in known, (message, known)

          # Same conversation must switch away from stale persisted domain when the
          # current message has a clear new-domain signal.
          d=Delegate(); l=Ledger(); runtime=ConversationOSRuntimeService(d,l)
          runtime.process('switch-user', 'I want to buy a laptop')
          assert l.state['known_fields']['domain'] == 'COMMERCE'
          runtime.process('switch-user', 'Explain this PDF')
          assert l.state['known_fields']['domain'] == 'DOCUMENTS'
          assert 'OASAT domain=DOCUMENTS' in d.last
          assert 'seller_matching' in d.last
          runtime.process('switch-user', 'Need doctor appointment')
          assert l.state['known_fields']['domain'] == 'APPOINTMENTS'
          assert 'book_after_approval' in d.last

          # A genuine follow-up with no new domain signal should retain the active
          # domain instead of falling back to an unrelated global template.
          runtime.process('switch-user', 'tomorrow morning')
          assert l.state['known_fields']['domain'] == 'APPOINTMENTS'
          assert 'OASAT domain=APPOINTMENTS' in d.last

          print('all OASAT domains + cross-domain switching + follow-up fallback passed')
          PY
